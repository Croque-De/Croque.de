  </div>
</div>

<script>
(function(){
  "use strict";
  // expose state so the React app can react to it
  window.__editMode = false;
  window.__suspendSnapshot = false;
  window.__currentUser = null;

  function setSyncDot(cls){
    const d = document.querySelector("#edit-toggle .sync-dot");
    if(!d) return;
    d.classList.remove("ok","saving","err");
    if(cls) d.classList.add(cls);
  }
  window.__setSyncDot = setSyncDot;

  function whenFirebaseReady(){
    return new Promise((res) => {
      if(window.__FB) return res(window.__FB);
      window.addEventListener("firebase-ready", () => res(window.__FB), { once:true });
    });
  }

  // Translate Firebase auth error codes to friendly French messages.
  function describeAuthError(err){
    const code = (err && err.code) || "";
    switch(code){
      case "auth/invalid-credential":
      case "auth/wrong-password":
      case "auth/user-not-found":
        return "Email ou mot de passe incorrect.";
      case "auth/invalid-email":
        return "Adresse email invalide.";
      case "auth/too-many-requests":
        return "Trop de tentatives. Réessaie plus tard.";
      case "auth/network-request-failed":
        return "Problème de connexion. Vérifie ta connexion internet.";
      case "auth/user-disabled":
        return "Ce compte a été désactivé.";
      default:
        return (err && err.message) ? err.message : "Erreur de connexion.";
    }
  }

  function applyMode(){
    window.dispatchEvent(new CustomEvent("edit-mode-changed", { detail: { editMode: window.__editMode } }));
  }

  function enterEditMode(){
    window.__editMode = true;
    document.body.classList.remove("read-only");
    const btn   = document.getElementById("edit-toggle");
    const icon  = document.getElementById("edit-icon");
    btn.classList.add("active");
    icon.textContent  = "🔓";
    btn.title = window.__currentUser
      ? "Connecté : " + (window.__currentUser.email || "compte") + " — clic pour se déconnecter"
      : "Connecté — clic pour se déconnecter";
    applyMode();
  }
  function leaveEditMode(){
    window.__editMode = false;
    document.body.classList.add("read-only");
    const btn   = document.getElementById("edit-toggle");
    const icon  = document.getElementById("edit-icon");
    btn.classList.remove("active");
    icon.textContent  = "🔒";
    btn.title = "Se connecter pour modifier";
    applyMode();
  }

  /* Open/close the login modal */
  function openLogin(){
    document.getElementById("login-error").textContent = "";
    document.getElementById("login-password").value = "";
    document.getElementById("login-overlay").classList.add("open");
    setTimeout(() => {
      const emailInput = document.getElementById("login-email");
      (emailInput.value ? document.getElementById("login-password") : emailInput).focus();
    }, 50);
  }
  function closeLogin(){
    document.getElementById("login-overlay").classList.remove("open");
  }

  async function tryLogin(){
    const email = document.getElementById("login-email").value.trim();
    const pwd   = document.getElementById("login-password").value;
    const err   = document.getElementById("login-error");
    const btn   = document.getElementById("login-submit");
    if(!email || !pwd){
      err.textContent = "Renseigne email et mot de passe.";
      return;
    }
    err.textContent = "";
    btn.disabled = true; btn.textContent = "Connexion…";
    try {
      const { auth, signInWithEmailAndPassword } = await whenFirebaseReady();
      await signInWithEmailAndPassword(auth, email, pwd);
      // onAuthStateChanged will handle the rest
      closeLogin();
    } catch(e){
      console.warn("Login failed:", e);
      err.textContent = describeAuthError(e);
    } finally {
      btn.disabled = false; btn.textContent = "Se connecter";
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("edit-toggle");

    // Toggle button click: open login OR sign out
    btn.addEventListener("click", async () => {
      if(window.__editMode){
        // currently editing → sign out and drop to read mode
        try {
          const { auth, signOut } = await whenFirebaseReady();
          await signOut(auth);
        } catch(e){ console.warn("Signout failed:", e); }
      } else {
        openLogin();
      }
    });

    // Login modal buttons
    document.getElementById("login-cancel").addEventListener("click", closeLogin);
    document.getElementById("login-submit").addEventListener("click", tryLogin);
    document.getElementById("login-password").addEventListener("keydown", e => {
      if(e.key === "Enter") tryLogin();
    });
    document.getElementById("login-email").addEventListener("keydown", e => {
      if(e.key === "Enter") document.getElementById("login-password").focus();
    });
    document.getElementById("login-overlay").addEventListener("click", (e) => {
      if(e.target.id === "login-overlay") closeLogin();
    });

    // React to Firebase auth state once it's ready
    whenFirebaseReady().then(({ auth, onAuthStateChanged }) => {
      onAuthStateChanged(auth, (user) => {
        window.__currentUser = user || null;
        if(user) enterEditMode();
        else     leaveEditMode();
      });
    });
  });
})();
</script>

// === Storage ===
const STORAGE_KEY = 'gantt-data-v1';
const API_KEY_STORAGE = 'gantt-anthropic-api-key';

// Helper: wait for the Firebase module script to have run.
function whenFirebaseReady() {
  return new Promise((resolve) => {
    if (window.__FB) return resolve(window.__FB);
    window.addEventListener('firebase-ready', () => resolve(window.__FB), { once: true });
  });
}

// Storage that:
//  - reads from Firebase (cloud) first, falls back to localStorage cache
//  - writes to Firebase (only when edit mode is active) AND localStorage cache
const storage = {
  async get() {
    try {
      const { docRef, getDoc } = await whenFirebaseReady();
      const snap = await getDoc(docRef);
      if (snap.exists()) {
        const data = snap.data();
        if (data && typeof data.json === 'string') {
          try { localStorage.setItem(STORAGE_KEY, data.json); } catch {}
          return { value: data.json };
        }
      }
    } catch (e) {
      console.warn('Firebase read failed, using local cache:', e);
    }
    try { return { value: localStorage.getItem(STORAGE_KEY) }; }
    catch { return null; }
  },
  async set(value) {
    // always keep a local cache
    try { localStorage.setItem(STORAGE_KEY, value); } catch {}
    // push to cloud only if an editor is logged in
    if (!window.__editMode) return true;
    try {
      const { docRef, setDoc } = await whenFirebaseReady();
      window.__suspendSnapshot = true;
      if (window.__setSyncDot) window.__setSyncDot('saving');
      await setDoc(docRef, { json: value, updatedAt: Date.now() });
      if (window.__setSyncDot) window.__setSyncDot('ok');
      // re-allow incoming snapshots after the echo passes
      setTimeout(() => { window.__suspendSnapshot = false; }, 800);
      return true;
    } catch (e) {
      console.warn('Firebase write failed:', e);
      if (window.__setSyncDot) window.__setSyncDot('err');
      window.__suspendSnapshot = false;
      return false;
    }
  }

// === Pricing (Claude Haiku 4.5, May 2026) ===
// $1.00 / M input tokens, $5.00 / M output tokens
const PRICE_INPUT_PER_MTOK = 1.00;
const PRICE_OUTPUT_PER_MTOK = 5.00;
const USD_TO_EUR = 0.92; // approximate

// Rough token estimator: ~3.5 chars/token for French text.
// For structured JSON output, use ~3 chars/token (denser).
function estimateTokens(text) {
  if (!text) return 0;
  return Math.ceil(text.length / 3.5);
}

// Estimate full cost of a planned AI request based on the user input
// plus the typical context (system prompt + tasks/folders/people list).
function estimateRequestCost(userInput, context) {
  // 1. System prompt: ~550 fixed tokens + variable context
  const baseSystemTokens = 550;
  const contextText = [
    (context.people || []).join(', '),
    (context.folders || []).map(f => f.name).join(', '),
    (context.tasks || []).map(t => t.name).join(' | '),
  ].join(' ');
  const contextTokens = estimateTokens(contextText);

  // 2. User message tokens
  const userTokens = estimateTokens(userInput);

  const inputTokens = baseSystemTokens + contextTokens + userTokens;

  // 3. Output: estimated ~80 tokens per detected task. Rough heuristic:
  //    one task per ~80 chars of user input, min 1 task if any text.
  const estimatedTasks = userInput.trim() ? Math.max(1, Math.ceil(userInput.length / 80)) : 0;
  const outputTokens = estimatedTasks * 80 + 30; // small overhead

  const inputCost = (inputTokens / 1_000_000) * PRICE_INPUT_PER_MTOK;
  const outputCost = (outputTokens / 1_000_000) * PRICE_OUTPUT_PER_MTOK;
  const totalUSD = inputCost + outputCost;
  const totalEUR = totalUSD * USD_TO_EUR;

  return {
    inputTokens, outputTokens, estimatedTasks,
    totalUSD, totalEUR,
  };
}

Réponds STRICTEMENT en JSON pur, sans markdown, sans \`\`\`, sans préambule. Structure attendue:

  const response = await fetch('https://api.anthropic.com/v1/messages', {

  }
  const data = await response.json();

const PALETTE = [
  { bar: '#0d9488', soft: '#ccfbf1', text: '#0f766e' },
  { bar: '#0284c7', soft: '#e0f2fe', text: '#0369a1' },

];

function colorFor(name, list) {
  const idx = list.indexOf(name);
  if (idx < 0) return PALETTE[0];
  return PALETTE[idx % PALETTE.length];
}
function parseDate(s) { return new Date(s + 'T00:00:00'); }
function toISO(d) {
  // Use LOCAL date parts to avoid timezone shifting the result back by a day.
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function fmt(d) {
  if (!d) return '';
  return parseDate(d).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
}
function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function shiftDate(dateStr, days) {
  const d = parseDate(dateStr);
  d.setDate(d.getDate() + days);
  return toISO(d);
}
function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return String(Date.now() + Math.random());
}
function durationTextFor(start, end) {
  if (!end) return 'Sans date de fin';
  const days = daysBetween(start, end) + 1;
  return days + ' jour' + (days > 1 ? 's' : '');
}

// === Folder tree helpers ===
// Flatten folder tree in DFS order, with depth info. Handles orphans.
function flattenFolderTree(folders) {
  const byParent = new Map();
  const ids = new Set(folders.map((f) => f.id));
  folders.forEach((f) => {
    const key = (f.parentId && ids.has(f.parentId)) ? f.parentId : '__root__';
    if (!byParent.has(key)) byParent.set(key, []);
    byParent.get(key).push(f);
  });
  byParent.forEach((arr) => arr.sort((a, b) => a.name.localeCompare(b.name)));
  const result = [];
  function walk(parentKey, depth) {
    const children = byParent.get(parentKey) || [];
    children.forEach((f) => {
      result.push({ folder: f, depth });
      walk(f.id, depth + 1);
    });
  }
  walk('__root__', 0);
  return result;
}

// Returns true if folder or any ancestor is collapsed.
function isFolderHidden(folderId, folders, collapsedMap) {
  if (!folderId) return false;
  let current = folders.find((f) => f.id === folderId);
  while (current) {
    if (collapsedMap[current.id]) return true;
    if (!current.parentId) return false;
    current = folders.find((f) => f.id === current.parentId);
  }
  return false;
}

// Returns set of folder ids that are descendants of a given folder (excluding self).
function getDescendantFolderIds(folderId, folders) {
  const result = new Set();
  function walk(parentId) {
    folders.forEach((f) => {
      if (f.parentId === parentId) {
        result.add(f.id);
        walk(f.id);
      }
    });
  }
  walk(folderId);
  return result;
}

// Compute effective dates considering dependencies.
// effective.start of a task = max(task.start, max(effective.end of deps))
// effective.end shifts by the same amount as start (preserves duration)
function computeEffectiveDates(tasks) {
  const byId = new Map(tasks.map((t) => [t.id, t]));
  const cache = new Map();
  const computing = new Set();
  function compute(id) {
    if (cache.has(id)) return cache.get(id);
    if (computing.has(id)) {
      const t = byId.get(id);
      return { start: t.start, end: t.end, shifted: false };
    }
    computing.add(id);
    const t = byId.get(id);
    if (!t) { computing.delete(id); return null; }
    let startMs = parseDate(t.start).getTime();
    (t.deps || []).forEach((depId) => {
      const dep = compute(depId);
      if (!dep) return;
      const depEndMs = dep.end ? parseDate(dep.end).getTime() : parseDate(dep.start).getTime();
      if (depEndMs > startMs) startMs = depEndMs;
    });
    const origStartMs = parseDate(t.start).getTime();
    const dShift = startMs - origStartMs;
    const newStart = toISO(new Date(startMs));
    let newEnd = t.end;
    if (t.end && dShift !== 0) {
      newEnd = toISO(new Date(parseDate(t.end).getTime() + dShift));
    }
    const result = { start: newStart, end: newEnd, shifted: dShift !== 0 };
    cache.set(id, result);
    computing.delete(id);
    return result;
  }
  tasks.forEach((t) => compute(t.id));
  return cache;
}

      folders
        .filter((f) => f.id !== id)
        .map((f) => (f.parentId === id ? { ...f, parentId: fallbackParentId } : f))
    );
    // Move tasks of the deleted folder to the parent
    setTasks(tasks.map((t) => (t.folderId === id ? { ...t, folderId: fallbackParentId } : t)));
    if (newFolderParentId === id) setNewFolderParentId(fallbackParentId);
  }

  function toggleFolderCollapse(id) {
    setCollapsedFolders((c) => ({ ...c, [id]: !c[id] }));
  }

  // === Drag commit ===
  function commitDrag(taskId, mode, deltaDays) {
    if (deltaDays === 0) return;
    const t = tasks.find(x => x.id === taskId);
    if (!canEditTask(t)) return; // silently ignore — drag handles are hidden anyway
    setTasks((prev) => prev.map((t) => {
      if (t.id !== taskId) return t;
      let newStart = t.start;
      let newEnd = t.end;
      const hasDeps = (t.deps || []).length > 0;
      if (mode === 'move') {
        if (hasDeps) return t; // locked
        newStart = shiftDate(t.start, deltaDays);
        if (t.end) newEnd = shiftDate(t.end, deltaDays);
      } else if (mode === 'start') {
        if (hasDeps) return t; // locked
        newStart = shiftDate(t.start, deltaDays);
        if (t.end && parseDate(newStart) > parseDate(t.end)) newStart = t.end;
      } else if (mode === 'end') {
        if (t.end) {
          newEnd = shiftDate(t.end, deltaDays);
          if (parseDate(newEnd) < parseDate(t.start)) newEnd = t.start;
        } else {
          // Add an end date — based on the effective start (in case of deps)
          const effStart = effectiveDates.get(t.id)?.start || t.start;
          newEnd = shiftDate(effStart, Math.max(0, deltaDays));
        }
      }
      return { ...t, start: newStart, end: newEnd };
    }));
  }

  // === AI Assistant ===
  async function runAI() {
    setAiError('');
    setAiPreview(null);
    if (!apiKey) { setAiError('Configure d\'abord ta clé API dans les réglages.'); return; }
    if (!aiInput.trim()) { setAiError('Décris une ou plusieurs tâches.'); return; }
    setAiLoading(true);
    try {
      const parsed = await parseTasksWithAI(apiKey, aiInput, { people, folders, tasks });
      setAiPreview(parsed);
    } catch (e) {
      setAiError(e.message || 'Erreur inconnue');
    } finally {
      setAiLoading(false);
    }
  }

  function applyAIPreview() {
    if (!isAdmin) { setAiError('Seuls les administrateurs peuvent utiliser l\'assistant IA.'); return; }
    if (!aiPreview || aiPreview.length === 0) return;
    // We add tasks sequentially, building a name->id map as we go so that
    // depsByName referring to tasks created in this same batch resolve correctly.
    const nameToId = new Map(tasks.map((t) => [t.name.toLowerCase(), t.id]));
    const newFolders = [...folders];
    const folderNameToId = new Map(newFolders.map((f) => [f.name.toLowerCase(), f.id]));
    const newTasks = [...tasks];

    aiPreview.forEach((p) => {
      // Resolve or create folder
      let folderId = null;
      if (p.folderName) {
        const key = p.folderName.toLowerCase();
        if (folderNameToId.has(key)) folderId = folderNameToId.get(key);
        else {
          const f = { id: uuid(), name: p.folderName };
          newFolders.push(f);
          folderNameToId.set(key, f.id);
          folderId = f.id;
        }
      }
      // Resolve deps
      const depIds = [];
      (p.depsByName || []).forEach((depName) => {
        const id = nameToId.get(String(depName).toLowerCase());
        if (id) depIds.push(id);
      });
      const t = {
        id: uuid(),
        name: p.name,
        assignee: p.assignee || 'Sans responsable',
        start: p.start || todayStr(),
        end: p.end || null,
        deps: depIds,
        folderId,
      };
      newTasks.push(t);
      nameToId.set(t.name.toLowerCase(), t.id);
    });

    setFolders(newFolders);
    setTasks(newTasks);
    setAiPreview(null);
    setAiInput('');
  }

  function handleSaveApiKey(k) {
    setApiKey(k);
    saveApiKey(k);
  }

  // === Timeline handlers (admin-only) ===
  function createTimeline(name) {
    if (!isAdmin) { alert("Seuls les administrateurs peuvent gérer la chronologie."); return; }
    const tl = { id: uuid(), name: name || 'Nouvelle frise', events: [] };
    setTimelines([...timelines, tl]);
    setActiveTimelineId(tl.id);
    return tl.id;
  }
  function renameTimeline(id, name) {
    if (!isAdmin) return;
    setTimelines(timelines.map((t) => (t.id === id ? { ...t, name } : t)));
  }
  function deleteTimeline(id) {
    if (!isAdmin) return;
    const next = timelines.filter((t) => t.id !== id);
    setTimelines(next);
    if (activeTimelineId === id) setActiveTimelineId(next[0]?.id || null);
  }
  function addEvent(timelineId, event) {
    if (!isAdmin) return;
    setTimelines(timelines.map((t) =>
      t.id === timelineId
        ? { ...t, events: [...t.events, { id: uuid(), ...event }] }
        : t
    ));
  }
  function updateEvent(timelineId, eventId, patch) {
    if (!isAdmin) return;
    setTimelines(timelines.map((t) =>
      t.id === timelineId
        ? { ...t, events: t.events.map((e) => (e.id === eventId ? { ...e, ...patch } : e)) }
        : t
    ));
  }
  function deleteEvent(timelineId, eventId) {
    if (!isAdmin) return;
    setTimelines(timelines.map((t) =>
      t.id === timelineId
        ? { ...t, events: t.events.filter((e) => e.id !== eventId) }
        : t
    ));
  }

  // === Import / Export ===
  // The exported file contains a header describing what's inside, plus the data.
  // - scope: "all" | "diagramme" | "frises"
  // - mode (on import): "replace" | "merge"
  function buildExportPayload(scope) {
    const payload = {
      type: 'gantt-planning-export',
      version: 1,
      exportedAt: new Date().toISOString(),
      scope,
    };
    if (scope === 'all' || scope === 'diagramme') {
      payload.tasks = tasks;
      payload.folders = folders;
    }
    if (scope === 'all' || scope === 'frises') {
      payload.timelines = timelines;
    }
    return payload;
  }

  function downloadExport(scope) {
    const payload = buildExportPayload(scope);
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const date = todayStr();
    const scopeLabel = scope === 'all' ? 'complet' : scope;
    a.href = url;
    a.download = 'planning_' + scopeLabel + '_' + date + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Parse an uploaded JSON file. Returns null on error.
  function parseImportFile(text) {
    try {
      const data = JSON.parse(text);
      // Basic validation. Be tolerant for older or partial formats.
      if (typeof data !== 'object' || data === null) return null;
      return {
        tasks: Array.isArray(data.tasks) ? data.tasks : null,
        folders: Array.isArray(data.folders) ? data.folders : null,
        timelines: Array.isArray(data.timelines) ? data.timelines : null,
        scope: data.scope || null,
        exportedAt: data.exportedAt || null,
      };
    } catch {
      return null;
    }
  }

  // Apply an imported payload according to the chosen scope ('diagramme'|'frises'|'all')
  // and mode ('replace'|'merge'). When merging, IDs are remapped to avoid collisions.
  function applyImport(payload, scope, mode) {
    const includeDiagramme = (scope === 'all' || scope === 'diagramme') &&
      (payload.tasks !== null || payload.folders !== null);
    const includeFrises = (scope === 'all' || scope === 'frises') && payload.timelines !== null;

    if (mode === 'replace') {
      if (includeDiagramme) {
        setTasks(payload.tasks || []);
        setFolders(payload.folders || []);
      }
      if (includeFrises) {
        setTimelines(payload.timelines || []);
        setActiveTimelineId((payload.timelines || [])[0]?.id || null);
      }
      return;
    }

    // Merge mode: remap all IDs so nothing collides with existing data.
    if (includeDiagramme) {
      const folderIdMap = new Map();
      (payload.folders || []).forEach((f) => folderIdMap.set(f.id, uuid()));
      const newFolders = (payload.folders || []).map((f) => ({
        ...f,
        id: folderIdMap.get(f.id),
        parentId: f.parentId ? (folderIdMap.get(f.parentId) || null) : null,
      }));

      const taskIdMap = new Map();
      (payload.tasks || []).forEach((t) => taskIdMap.set(t.id, uuid()));
      const newTasks = (payload.tasks || []).map((t) => ({
        ...t,
        id: taskIdMap.get(t.id),
        folderId: t.folderId ? (folderIdMap.get(t.folderId) || null) : null,
        deps: (t.deps || []).map((d) => taskIdMap.get(d)).filter(Boolean),
      }));

      setFolders([...folders, ...newFolders]);
      setTasks([...tasks, ...newTasks]);
    }
    if (includeFrises) {
      const newTimelines = (payload.timelines || []).map((tl) => {
        const eventIdMap = new Map();
        (tl.events || []).forEach((e) => eventIdMap.set(e.id, uuid()));
        return {
          ...tl,
          id: uuid(),
          events: (tl.events || []).map((e) => ({
            ...e,
            id: eventIdMap.get(e.id),
            deps: (e.deps || []).map((d) => eventIdMap.get(d)).filter(Boolean),
          })),
        };
      });
      setTimelines([...timelines, ...newTimelines]);
    }
  }

  const selectedTask = tasks.find((t) => t.id === selectedId);
  const blockedBySelected = selectedTask ? tasks.filter((t) => (t.deps || []).includes(selectedTask.id)) : [];
  const blockingSelected = selectedTask ? (selectedTask.deps || []).map((d) => tasks.find((t) => t.id === d)).filter(Boolean) : [];

  return (
    <div className="min-h-screen w-full" style={{ background: '#fafaf7', color: '#1c1917' }}>
      <header className="border-b" style={{ borderColor: '#e7e5e4', background: '#fafaf7' }}>
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-5 flex items-center justify-between flex-wrap gap-3">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: '#1c1917', color: '#fafaf7' }}>
              <BarChart3 size={18} />
            </div>
            <div>
              <h1 className="font-display text-2xl font-semibold leading-none">Planning</h1>
              <p className="text-xs mt-1" style={{ color: '#78716c' }}>
                {tasks.length} {tasks.length > 1 ? 'tâches' : 'tâche'} · {folders.length} dossier{folders.length !== 1 ? 's' : ''} · {people.length} {people.length > 1 ? 'personnes' : 'personne'}
              </p>
            </div>
          </div>
          <nav className="flex items-center gap-2 flex-wrap">
            <button onClick={() => setProfileOpen(true)}
              className="px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-1.5 transition-all hover:brightness-95"
              style={{
                background: profile.pseudo ? '#fafaf7' : '#1c1917',
                color: profile.pseudo ? '#1c1917' : '#fafaf7',
                border: '1px solid ' + (profile.pseudo ? '#d6d3d1' : '#1c1917'),
              }}>
              <User size={14} />
              {profile.pseudo || 'Profil'}
            </button>
            <div className="flex items-center gap-1 p-1 rounded-lg" style={{ background: '#f5f5f4' }}>
              <TabButton active={tab === 'gestion'} onClick={() => setTab('gestion')} icon={<ListChecks size={15} />}>Gestion</TabButton>
              <TabButton active={tab === 'diagramme'} onClick={() => setTab('diagramme')} icon={<BarChart3 size={15} />}>Diagramme</TabButton>
              <TabButton active={tab === 'liste'} onClick={() => setTab('liste')} icon={<ListChecks size={15} />}>Tâches</TabButton>
              <TabButton active={tab === 'chrono'} onClick={() => setTab('chrono')} icon={<Calendar size={15} />}>Chronologie</TabButton>
            </div>
          </nav>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6">
        {tab === 'gestion' && (
          <GestionView
            tasks={tasks} folders={folders} people={people} effectiveDates={effectiveDates}
            form={form} setForm={setForm} editingId={editingId}
            saveTask={saveTask} cancelEdit={cancelEdit}
            startEdit={startEdit} deleteTask={deleteTask} deleteTasks={deleteTasks}
            depDropdownOpen={depDropdownOpen} setDepDropdownOpen={setDepDropdownOpen}
            folderDropdownOpen={folderDropdownOpen} setFolderDropdownOpen={setFolderDropdownOpen}
            toggleDep={toggleDep} error={error}
            newFolderName={newFolderName} setNewFolderName={setNewFolderName}
            newFolderParentId={newFolderParentId} setNewFolderParentId={setNewFolderParentId}
            addFolder={addFolder} deleteFolder={deleteFolder}
            formCardRef={formCardRef}
            isAdmin={isAdmin} userEmail={userEmail}
            ai={{
              apiKey, input: aiInput, setInput: setAiInput,
              loading: aiLoading, error: aiError,
              preview: aiPreview, setPreview: setAiPreview,
              run: runAI, apply: applyAIPreview,
              saveKey: handleSaveApiKey,
            }}
          />
        )}
        {tab === 'diagramme' && (
          <DiagrammeView
            tasks={tasks} folders={folders} people={people} effectiveDates={effectiveDates}
            selectedTask={selectedTask} setSelectedId={setSelectedId}
            collapsedFolders={collapsedFolders} toggleFolderCollapse={toggleFolderCollapse}
            blockedBySelected={blockedBySelected} blockingSelected={blockingSelected}
            startEdit={startEdit} commitDrag={commitDrag}
            selectedFolderId={selectedFolderId} setSelectedFolderId={setSelectedFolderId}
            profile={profile}
            isAdmin={isAdmin} userEmail={userEmail}
          />
        )}
        {tab === 'liste' && (
          <TaskListView
            tasks={tasks} folders={folders} effectiveDates={effectiveDates}
          />
        )}
        {tab === 'chrono' && (
          <ChronologyView
            timelines={timelines}
            activeTimelineId={activeTimelineId}
            setActiveTimelineId={setActiveTimelineId}
            createTimeline={createTimeline}
            renameTimeline={renameTimeline}
            deleteTimeline={deleteTimeline}
            addEvent={addEvent}
            updateEvent={updateEvent}
            deleteEvent={deleteEvent}
            isAdmin={isAdmin}
          />
        )}
      </main>

      {profileOpen && (
        <ProfileModal
          profile={profile} setProfile={setProfile}
          isAdmin={isAdmin} userEmail={userEmail}
          adminsList={adminsList} setAdminsList={setAdminsList}
          profilesMap={profilesMap}
          onClose={() => setProfileOpen(false)}
        />
      )}
    </div>
  );
}

function TaskListView({ tasks, folders, effectiveDates }) {
  // Path of folder names (e.g. "Marketing › Lancement") for a given folder id
  function folderPath(folderId) {
    if (!folderId || folderId === NO_FOLDER) return '';
    const names = [];
    let current = folders.find((f) => f.id === folderId);
    let guard = 0;
    while (current && guard++ < 50) {
      names.unshift(current.name);
      current = folders.find((f) => f.id === current.parentId);
    }
    return names.join(' › ');
  }

  // Sort by effective start date ascending; tasks without a date go last.
  const sorted = useMemo(() => {
    return [...tasks].sort((a, b) => {
      const sa = (effectiveDates[a.id] && effectiveDates[a.id].start) || a.start || '';
      const sb = (effectiveDates[b.id] && effectiveDates[b.id].start) || b.start || '';
      if (!sa) return 1;
      if (!sb) return -1;
      return parseDate(sa) - parseDate(sb);
    });
  }, [tasks, effectiveDates]);

  if (tasks.length === 0) {
    return (
      <div className="text-center py-16 rounded-lg" style={{ background: '#fff', border: '1px solid #e7e5e4' }}>
        <ListChecks size={28} style={{ color: '#d6d3d1' }} className="mx-auto mb-2" />
        <p className="text-sm font-medium" style={{ color: '#57534e' }}>Aucune tâche pour le moment.</p>
        <p className="text-xs mt-1" style={{ color: '#a8a29e' }}>Va dans l'onglet "Gestion" pour en ajouter.</p>
      </div>
    );
  }

  return (
    <div className="rounded-lg overflow-hidden" style={{ background: '#fff', border: '1px solid #e7e5e4' }}>
      <div className="px-4 py-3 flex items-center justify-between" style={{ borderBottom: '1px solid #f0efed' }}>
        <h2 className="font-display text-lg font-semibold">Liste des tâches</h2>
        <span className="text-xs" style={{ color: '#a8a29e' }}>{sorted.length} tâche{sorted.length > 1 ? 's' : ''} · triées par date de début</span>
      </div>
      <div className="overflow-x-auto scroll-area">
        <table className="w-full text-sm" style={{ borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ background: '#fafaf7', color: '#78716c' }} className="text-left text-[11px] uppercase tracking-wider">
              <th className="px-4 py-2 font-semibold">#</th>
              <th className="px-4 py-2 font-semibold">Tâche</th>
              <th className="px-4 py-2 font-semibold">Responsable</th>
              <th className="px-4 py-2 font-semibold">Dossier</th>
              <th className="px-4 py-2 font-semibold">Début</th>
              <th className="px-4 py-2 font-semibold">Fin</th>
            </tr>
          </thead>
          <tbody>
            {sorted.map((t, i) => {
              const eff = effectiveDates[t.id] || {};
              const start = eff.start || t.start;
              const end = eff.end || t.end;
              const path = folderPath(t.folderId);
              return (
                <tr key={t.id} style={{ borderTop: '1px solid #f0efed' }} className="hover:bg-stone-50">
                  <td className="px-4 py-2.5 tabular-nums" style={{ color: '#a8a29e' }}>{i + 1}</td>
                  <td className="px-4 py-2.5 font-medium" style={{ color: '#1c1917' }}>
                    {t.name}
                    {eff.shifted && (
                      <span className="ml-2 text-[10px] px-1.5 py-0.5 rounded" style={{ background: '#fef3c7', color: '#92400e' }} title="Décalée par une dépendance">décalée</span>
                    )}
                  </td>
                  <td className="px-4 py-2.5" style={{ color: '#57534e' }}>{t.assignee || '—'}</td>
                  <td className="px-4 py-2.5" style={{ color: path ? '#57534e' : '#d6d3d1' }}>{path || '—'}</td>
                  <td className="px-4 py-2.5 tabular-nums" style={{ color: '#57534e' }}>{fmt(start) || '—'}</td>
                  <td className="px-4 py-2.5 tabular-nums" style={{ color: '#57534e' }}>{fmt(end) || '—'}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function TabButton({ active, onClick, children, icon }) {
  return (
    <button onClick={onClick}
      className="px-3 py-1.5 rounded-md text-sm font-medium flex items-center gap-1.5 transition-all"
      style={{
        background: active ? '#fafaf7' : 'transparent',
        color: active ? '#1c1917' : '#57534e',
        boxShadow: active ? '0 1px 2px rgba(0,0,0,0.06)' : 'none',
      }}>
      {icon}{children}
    </button>
  );
}

function Field({ label, children, hint }) {
  return (
    <label className="block">
      <div className="flex items-baseline justify-between mb-1">
        <span className="text-xs font-medium" style={{ color: '#57534e' }}>{label}</span>
        {hint && <span className="text-[10px]" style={{ color: '#a8a29e' }}>{hint}</span>}
      </div>
      {children}
    </label>
  );
}

function GestionView({
  tasks, folders, people, effectiveDates,
  form, setForm, editingId,
  saveTask, cancelEdit, startEdit, deleteTask, deleteTasks,
  depDropdownOpen, setDepDropdownOpen,
  folderDropdownOpen, setFolderDropdownOpen,
  toggleDep, error,
  newFolderName, setNewFolderName,
  newFolderParentId, setNewFolderParentId,
  addFolder, deleteFolder,
  formCardRef,
  isAdmin, userEmail,
  ai,
}) {
  const folderTree = useMemo(() => flattenFolderTree(folders), [folders]);

  // === Multi-selection ===
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const [lastClickedId, setLastClickedId] = useState(null);

  // Clean up selection when tasks change (e.g. deleted from elsewhere)
  useEffect(() => {
    setSelectedIds((prev) => {
      const next = new Set();
      const taskIdSet = new Set(tasks.map((t) => t.id));
      prev.forEach((id) => { if (taskIdSet.has(id)) next.add(id); });
      return next.size === prev.size ? prev : next;
    });
  }, [tasks]);

  // ESC to clear selection
  useEffect(() => {
    function onKey(e) {
      if (e.key === 'Escape' && selectedIds.size > 0) {
        setSelectedIds(new Set());
      }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [selectedIds]);

  const grouped = useMemo(() => {
    const byFolder = new Map();
    tasks.forEach((t) => {
      const fid = t.folderId || NO_FOLDER;
      if (!byFolder.has(fid)) byFolder.set(fid, []);
      byFolder.get(fid).push(t);
    });
    const result = [];
    folderTree.forEach(({ folder, depth }) => {
      if (byFolder.has(folder.id)) result.push({ folder, depth, tasks: byFolder.get(folder.id) });
    });
    if (byFolder.has(NO_FOLDER)) result.push({ folder: null, depth: 0, tasks: byFolder.get(NO_FOLDER) });
    result.forEach((g) => g.tasks.sort((a, b) => parseDate(effectiveDates.get(a.id)?.start || a.start) - parseDate(effectiveDates.get(b.id)?.start || b.start)));
    return result;
  }, [tasks, folderTree, effectiveDates]);

  // Flat ordered list of task ids matching the displayed order (folder -> person -> date)
  const orderedTaskIds = useMemo(() => {
    const ids = [];
    grouped.forEach((g) => {
      const byPerson = new Map();
      g.tasks.forEach((t) => {
        if (!byPerson.has(t.assignee)) byPerson.set(t.assignee, []);
        byPerson.get(t.assignee).push(t);
      });
      Array.from(byPerson.values()).forEach((list) => list.forEach((t) => ids.push(t.id)));
    });
    return ids;
  }, [grouped]);

  function handleRowClick(id, event) {
    if (event.shiftKey && lastClickedId) {
      const idx1 = orderedTaskIds.indexOf(lastClickedId);
      const idx2 = orderedTaskIds.indexOf(id);
      if (idx1 < 0 || idx2 < 0) {
        setSelectedIds(new Set([id]));
      } else {
        const range = orderedTaskIds.slice(Math.min(idx1, idx2), Math.max(idx1, idx2) + 1);
        setSelectedIds(new Set(range));
      }
    } else if (event.ctrlKey || event.metaKey) {
      const next = new Set(selectedIds);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      setSelectedIds(next);
      setLastClickedId(id);
    } else {
      // Plain click: if alone, deselect; otherwise replace with this one
      if (selectedIds.size === 1 && selectedIds.has(id)) {
        setSelectedIds(new Set());
        setLastClickedId(null);
      } else {
        setSelectedIds(new Set([id]));
        setLastClickedId(id);
      }
    }
  }

  function bulkDelete() {
    if (selectedIds.size === 0) return;
    const n = selectedIds.size;
    if (!confirm('Supprimer ' + n + ' tâche' + (n > 1 ? 's' : '') + ' ?')) return;
    deleteTasks(Array.from(selectedIds));
    setSelectedIds(new Set());
    setLastClickedId(null);
  }

  function selectAllVisible() {

        <div className="rounded-xl p-5 border" style={{ background: '#ffffff', borderColor: '#e7e5e4' }}>

                  style={{ borderColor: '#d6d3d1', background: '#fafaf7' }}>
                  <option value="">Racine</option>
                  {folderTree.map(({ folder, depth }) => (
                    <option key={folder.id} value={folder.id}>
                      {'— '.repeat(depth) + folder.name}

                  ))}
                </select>
              </div>
            )}
          </div>

          {folders.length === 0 ? (
            <p className="text-xs italic" style={{ color: '#a8a29e' }}>Pas encore de dossier.</p>
          ) : (
            <div className="space-y-0.5">
              {folderTree.map(({ folder, depth }) => {
                const count = tasks.filter((t) => t.folderId === folder.id).length;
                const subCount = folders.filter((f) => f.parentId === folder.id).length;
                return (
                  <div key={folder.id}
                    className="flex items-center gap-2 px-2 py-1.5 rounded-md hover:bg-stone-50"
                    style={{ paddingLeft: 8 + depth * 16 }}>

                      <span style={{ color: '#d6d3d1' }}>└</span>
                    )}
                    <Folder size={13} style={{ color: '#78716c' }} />
                    <span className="flex-1 text-sm truncate">{folder.name}</span>
                    {subCount > 0 && (
                      <span className="text-[9px] px-1 rounded" style={{ background: '#f5f5f4', color: '#78716c' }} title="sous-dossiers">
                        {subCount}↳
                      </span>
                    )}
                    <span className="text-[10px]" style={{ color: '#a8a29e' }}>{count}</span>
                    <button
                      onClick={() => setNewFolderParentId(folder.id)}
                      className="p-1 rounded hover:bg-stone-100"
                      style={{ color: newFolderParentId === folder.id ? '#1c1917' : '#a8a29e' }}
                      title="Créer un sous-dossier ici">
                      <FolderPlus size={11} />
                    </button>
                    <button onClick={() => {
                      const msg = subCount > 0
                        ? 'Supprimer ce dossier ? Ses sous-dossiers et tâches remonteront d\'un niveau.'

                      <X size={12} />

          )}

        <div ref={formCardRef} className="rounded-xl p-5 border" style={{ background: '#ffffff', borderColor: editingId ? '#1c1917' : '#e7e5e4' }}>

          <div className="space-y-3">
            <Field label="Tâche">
              <input type="text" value={form.name}

        ) : (
          <div className="space-y-6">
            {grouped.map((group) => {
              const byPerson = new Map();
              group.tasks.forEach((t) => {

                byPerson.get(t.assignee).push(t);

              const depth = group.depth || 0;
              return (
                <div key={group.folder?.id || 'none'} style={{ paddingLeft: depth * 16 }}>
                  <div className="flex items-center gap-2 mb-3 pb-2 border-b" style={{ borderColor: '#e7e5e4' }}>
                    {group.folder ? (
                      <>
                        {depth > 0 && <span style={{ color: '#d6d3d1' }}>└</span>}
                        <Folder size={14} style={{ color: '#57534e' }} />

                      </>

                      <h3 className="font-display text-base font-semibold italic" style={{ color: '#78716c' }}>Sans dossier</h3>
                    )}
                    <span className="text-xs" style={{ color: '#a8a29e' }}>· {group.tasks.length}</span>
                  </div>

                  <div className="space-y-4">
                    {Array.from(byPerson.entries()).map(([person, list]) => {
                      const c = colorFor(person, people);
                      return (
                        <div key={person}>
                          <div className="flex items-center gap-2 mb-2">
                            <div className="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-semibold"
                              style={{ background: c.soft, color: c.text }}>
                              {person.slice(0, 2).toUpperCase()}

                            <span className="font-medium text-xs">{person}</span>

                          <div className="space-y-2">
                            {list.map((t) => {

                              const isSelected = selectedIds.has(t.id);
                              const eff = effectiveDates.get(t.id) || { start: t.start, end: t.end };
                              return (
                                <div key={t.id}

                                  style={{
                                    background: isEditing ? '#fef3c7' : (isSelected ? '#e0f2fe' : '#fff'),
                                    borderColor: isEditing ? '#d97706' : (isSelected ? '#0284c7' : '#e7e5e4'),

                                  <div className="flex-1 min-w-0">
                                    <div className="font-medium text-sm flex items-center gap-1.5">
                                      {isSelected && (
                                        <span className="inline-flex items-center justify-center w-3.5 h-3.5 rounded-full flex-shrink-0"
                                          style={{ background: '#0284c7', color: '#fff' }}>

                                      <span className="truncate">{t.name}</span>
                                    </div>
                                    <div className="text-xs mt-1 flex items-center gap-2 flex-wrap" style={{ color: '#78716c' }}>
                                      <span className="inline-flex items-center gap-1">
                                        <Calendar size={12} />
                                        {fmt(eff.start)}
                                        {eff.end ? <> → {fmt(eff.end)}</> : (
                                          <span className="ml-1 inline-flex items-center gap-0.5 italic" style={{ color: '#a8a29e' }}>
                                            <ArrowRight size={11} />sans fin
                                          </span>
                                        )}
                                      </span>
                                      <span style={{ color: '#a8a29e' }}>·</span>
                                      <span>{durationTextFor(eff.start, eff.end)}</span>
                                    </div>
                                    {depTasks.length > 0 && (
                                      <div className="mt-2 flex items-start gap-1.5 text-xs">
                                        <span className="mt-0.5 flex-shrink-0" style={{ color: '#a8a29e' }}><Link2 size={12} /></span>
                                        <div className="flex flex-wrap gap-1">
                                          {depTasks.map((d) => (
                                            <span key={d.id} className="px-1.5 py-0.5 rounded"
                                              style={{ background: '#f5f5f4', color: '#57534e' }}>{d.name}</span>
                                          ))}
                                        </div>
                                      </div>
                                    )}
                                  </div>
                                  <div className="flex flex-col gap-1">
                                    <button onClick={(e) => { e.stopPropagation(); startEdit(t.id); }}
                                      className="p-1.5 rounded-md hover:bg-stone-100 transition-colors"
                                      style={{ color: '#57534e' }} title="Modifier">
                                      <Pencil size={13} />
                                    </button>
                                    <button onClick={(e) => { e.stopPropagation(); deleteTask(t.id); }}
                                      className="p-1.5 rounded-md hover:bg-stone-100 transition-colors"
                                      style={{ color: '#a8a29e' }} title="Supprimer">
                                      <Trash2 size={13} />
                                    </button>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </section>
    </div>
  );
}

// === Gantt bar with drag-to-resize ===
function GanttBar({ task, color, posLeft, posWidth, ROW_H, DAY_W, openEnded, isSelected, isRelated, hasDeps, onSelect, commitDrag }) {
  const [drag, setDrag] = useState(null); // { mode, startX, deltaDays }

  const startDrag = (mode) => (e) => {
    e.stopPropagation();
    e.preventDefault();
    document.body.classList.add(mode === 'move' ? 'dragging-move' : 'dragging');
    setDrag({ mode, startX: e.clientX, deltaDays: 0, moved: false });
  };

  useEffect(() => {
    if (!drag) return;
    const onMove = (e) => {
      const dx = e.clientX - drag.startX;
      const deltaDays = Math.round(dx / DAY_W);
      const moved = Math.abs(dx) > 3;
      if (deltaDays !== drag.deltaDays || moved !== drag.moved) {
        setDrag((d) => ({ ...d, deltaDays, moved }));
      }
    };
    const onUp = () => {
      if (drag.moved && drag.deltaDays !== 0) {
        commitDrag(task.id, drag.mode, drag.deltaDays);
      } else if (!drag.moved) {
        onSelect(task.id);
      }
      document.body.classList.remove('dragging', 'dragging-move');
      setDrag(null);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
  }, [drag, task.id, DAY_W, commitDrag, onSelect]);

  // Drag preview
  let dispLeft = posLeft, dispWidth = posWidth;
  if (drag && drag.moved) {
    const dxPx = drag.deltaDays * DAY_W;
    if (drag.mode === 'move') dispLeft = posLeft + dxPx;
    else if (drag.mode === 'start') { dispLeft = posLeft + dxPx; dispWidth = Math.max(DAY_W * 0.5, posWidth - dxPx); }
    else if (drag.mode === 'end') dispWidth = Math.max(DAY_W * 0.5, posWidth + dxPx);
  }

  const canDragBody = !hasDeps;
  const canDragStart = !hasDeps;
  const canDragEnd = true; // always allowed (even on open-ended → adds end date)

  const bg = openEnded
    ? `linear-gradient(90deg, ${color.bar} 0%, ${color.bar} 55%, ${color.bar}88 80%, ${color.bar}22 100%)`
    : color.bar;

  return (
    <div
      className="gantt-bar"
      onMouseDown={(e) => {
        if (canDragBody) startDrag('move')(e);
        else { e.stopPropagation(); onSelect(task.id); }
      }}
      style={{
        position: 'absolute', left: dispLeft, width: dispWidth, top: 8, height: ROW_H - 16,
        background: bg, color: '#fff',
        borderRadius: 6,
        boxShadow: isSelected ? '0 0 0 2px #1c1917' : isRelated ? '0 0 0 2px #d97706' : 'none',
        cursor: canDragBody ? 'grab' : 'pointer',
        display: 'flex', alignItems: 'center', padding: '0 10px', gap: 6,
        userSelect: 'none',
      }}
      title={task.name + ' — ' + task.assignee + (openEnded ? ' (sans date de fin)' : '') + (hasDeps ? ' • bloquée par une autre' : '')}
    >
      {/* Left handle */}
      {canDragStart && (
        <div className="bar-handle"
          onMouseDown={startDrag('start')}
          style={{
            position: 'absolute', left: 0, top: 0, bottom: 0, width: 6,
            cursor: 'ew-resize',
            background: 'rgba(255,255,255,0.55)',
            borderRadius: '6px 0 0 6px',
          }} />
      )}

      {/* Body content */}
      {(task.deps || []).length > 0 && <Link2 size={11} className="flex-shrink-0 opacity-90" />}
      <span className="text-[11px] font-medium truncate flex-1">{task.name}</span>
      {openEnded && <ArrowRight size={11} className="flex-shrink-0 opacity-90" />}

      {/* Right handle */}
      {canDragEnd && (
        <div className="bar-handle"
          onMouseDown={startDrag('end')}
          style={{
            position: 'absolute', right: 0, top: 0, bottom: 0, width: 6,
            cursor: 'ew-resize',
            background: openEnded ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.55)',
            borderRadius: '0 6px 6px 0',
          }} />
      )}
    </div>
  );
}

// === Diagram view ===
function DiagrammeView({
  tasks, folders, people, effectiveDates,
  selectedTask, setSelectedId,
  collapsedFolders, toggleFolderCollapse,
  blockedBySelected, blockingSelected, startEdit, commitDrag,
  selectedFolderId, setSelectedFolderId, profile,
}) {
  const folderTree = useMemo(() => flattenFolderTree(folders), [folders]);
  const [zoomLevel, setZoomLevel] = useState('day'); // 'day' | 'month' | 'year'

  // Filter tasks based on selected folder in sidebar.
  // '__all__' = all tasks, '__me__' = tasks for the user, '__none__' = no folder,
  // folder id = that folder + its descendants
  const filteredTasks = useMemo(() => {
    if (selectedFolderId === '__all__' || !selectedFolderId) return tasks;
    if (selectedFolderId === '__me__') {
      if (!profile.pseudo) return tasks;
      return tasks.filter((t) => t.assignee.toLowerCase() === profile.pseudo.toLowerCase());
    }
    if (selectedFolderId === '__none__') return tasks.filter((t) => !t.folderId);
    const descendants = getDescendantFolderIds(selectedFolderId, folders);
    descendants.add(selectedFolderId);
    return tasks.filter((t) => t.folderId && descendants.has(t.folderId));
  }, [tasks, selectedFolderId, folders, profile]);

  const groups = useMemo(() => {
    const byFolder = new Map();
    filteredTasks.forEach((t) => {
      const fid = t.folderId || NO_FOLDER;
      if (!byFolder.has(fid)) byFolder.set(fid, []);
      byFolder.get(fid).push(t);
    });
    const result = [];
    const sortFn = (a, b) => parseDate(effectiveDates.get(a.id)?.start || a.start) - parseDate(effectiveDates.get(b.id)?.start || b.start) || a.assignee.localeCompare(b.assignee);
    folderTree.forEach(({ folder: f, depth }) => {
      if (byFolder.has(f.id)) result.push({ folder: f, depth, tasks: [...byFolder.get(f.id)].sort(sortFn) });
    });
    if (byFolder.has(NO_FOLDER)) result.push({ folder: null, depth: 0, tasks: [...byFolder.get(NO_FOLDER)].sort(sortFn) });
    return result;
  }, [filteredTasks, folderTree, effectiveDates]);

  const allTasksFlat = useMemo(() => groups.flatMap((g) => g.tasks), [groups]);

  const range = useMemo(() => {
    if (allTasksFlat.length === 0) return null;
    let min = null, max = null;
    allTasksFlat.forEach((t) => {
      const eff = effectiveDates.get(t.id) || { start: t.start, end: t.end };
      const s = parseDate(eff.start);
      const e = eff.end ? parseDate(eff.end) : s;
      if (!min || s < min) min = s;
      if (!max || e > max) max = e;
    });
    const today = parseDate(todayStr());
    if (today < min) min = today;
    if (today > max) max = today;
    min = new Date(min); min.setDate(min.getDate() - 2);
    max = new Date(max); max.setDate(max.getDate() + 5);
    const total = Math.round((max - min) / 86400000) + 1;
    return { min, max, total };
  }, [allTasksFlat, effectiveDates]);

  if (tasks.length === 0) {
    return (
      <div className="rounded-xl border-2 border-dashed p-12 text-center" style={{ borderColor: '#e7e5e4' }}>
        <div className="flex justify-center mb-3" style={{ color: '#a8a29e' }}><BarChart3 size={36} /></div>
        <p className="text-sm" style={{ color: '#78716c' }}>Pas encore de tâches à afficher.</p>
        <p className="text-xs mt-1" style={{ color: '#a8a29e' }}>Va dans l'onglet "Gestion" pour en ajouter.</p>
      </div>
    );
  }

  // Build sidebar (folder tree + special entries)
  const sidebar = (
    <FolderTreeSidebar
      folders={folders} folderTree={folderTree} tasks={tasks}
      selectedFolderId={selectedFolderId} setSelectedFolderId={setSelectedFolderId}
      collapsedFolders={collapsedFolders} toggleFolderCollapse={toggleFolderCollapse}
      profile={profile}
    />
  );

  // No tasks remain after filtering
  if (allTasksFlat.length === 0 || !range) {
    return (
      <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
        <div className="lg:col-span-1">{sidebar}</div>
        <div className="lg:col-span-3">
          <div className="rounded-xl border-2 border-dashed p-12 text-center" style={{ borderColor: '#e7e5e4' }}>
            <div className="flex justify-center mb-3" style={{ color: '#a8a29e' }}><Users size={36} /></div>
            <p className="text-sm" style={{ color: '#78716c' }}>Aucune tâche dans cette sélection.</p>
            <p className="text-xs mt-1" style={{ color: '#a8a29e' }}>Clique sur "Toutes les tâches" à gauche pour voir tout.</p>
          </div>
        </div>
      </div>
    );
  }

  const DAY_W = zoomLevel === 'day' ? 36 : zoomLevel === 'month' ? 4 : 0.6;
  const ROW_H = 44, FOLDER_H = 32, LEFT_W = 220, HEADER_H = 56;

  const days = Array.from({ length: range.total }, (_, i) => {
    const d = new Date(range.min); d.setDate(d.getDate() + i); return d;
  });

  // Build header rows depending on zoom level.
  // - 'day': month band on top, day band below (one cell per day)
  // - 'month': year band on top, month band below
  // - 'year': year band only (one row)
  const headerRows = useMemo(() => {
    if (zoomLevel === 'day') {
      const months = [];
      days.forEach((d) => {
        const key = d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
        const last = months[months.length - 1];
        if (last && last.key === key) last.count++;
        else months.push({ key, count: 1 });
      });
      return { top: months, bottom: 'days' };
    }
    if (zoomLevel === 'month') {
      const years = [];
      const months = [];
      days.forEach((d) => {
        const yKey = String(d.getFullYear());
        const mKey = d.toLocaleDateString('fr-FR', { month: 'short' }) + ' ' + d.getFullYear();
        const lastY = years[years.length - 1];
        if (lastY && lastY.key === yKey) lastY.count++;
        else years.push({ key: yKey, label: yKey, count: 1 });
        const lastM = months[months.length - 1];
        if (lastM && lastM.key === mKey) lastM.count++;
        else months.push({ key: mKey, label: d.toLocaleDateString('fr-FR', { month: 'short' }), count: 1 });
      });
      return { top: years, bottom: months };
    }
    // year
    const years = [];
    days.forEach((d) => {
      const yKey = String(d.getFullYear());
      const lastY = years[years.length - 1];
      if (lastY && lastY.key === yKey) lastY.count++;
      else years.push({ key: yKey, label: yKey, count: 1 });
    });
    return { top: years, bottom: null };
  }, [days, zoomLevel]);

  function posFor(task) {
    const eff = effectiveDates.get(task.id) || { start: task.start, end: task.end };
    const startOffset = Math.round((parseDate(eff.start) - range.min) / 86400000);
    if (!eff.end) return { left: startOffset * DAY_W, width: DAY_W * 1.4, openEnded: true };
    const duration = Math.round((parseDate(eff.end) - parseDate(eff.start)) / 86400000) + 1;
    return { left: startOffset * DAY_W, width: duration * DAY_W, openEnded: false };
  }

  const todayOffset = Math.round((new Date(new Date().toDateString()) - range.min) / 86400000);
  const todayInRange = todayOffset >= 0 && todayOffset < range.total;
  const chartHeight = groups.reduce((acc, g) => {
    if (g.folder && isFolderHidden(g.folder.id, folders, collapsedFolders)) return acc;
    if (!g.folder) return acc + g.tasks.length * ROW_H;
    const collapsed = collapsedFolders[g.folder.id];
    return acc + FOLDER_H + (collapsed ? 0 : g.tasks.length * ROW_H);
  }, 0);

  return (
    <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
      <div className="lg:col-span-1">{sidebar}</div>
      <div className={selectedTask ? 'lg:col-span-2' : 'lg:col-span-3'}>
        <div className="mb-3 flex items-center gap-2 justify-end">
          <span className="text-[10px] uppercase tracking-wider" style={{ color: '#a8a29e' }}>Échelle</span>
          <div className="flex items-center gap-0.5 p-0.5 rounded-lg" style={{ background: '#f5f5f4' }}>
            {[
              { id: 'day', label: 'Jour' },
              { id: 'month', label: 'Mois' },
              { id: 'year', label: 'Année' },
            ].map((z) => (
              <button key={z.id} onClick={() => setZoomLevel(z.id)}
                className="px-2.5 py-1 rounded-md text-xs font-medium transition-all"
                style={{
                  background: zoomLevel === z.id ? '#fafaf7' : 'transparent',
                  color: zoomLevel === z.id ? '#1c1917' : '#57534e',
                  boxShadow: zoomLevel === z.id ? '0 1px 2px rgba(0,0,0,0.06)' : 'none',
                }}>
                {z.label}
              </button>
            ))}
          </div>
        </div>
        <div className="rounded-xl border overflow-hidden" style={{ background: '#fff', borderColor: '#e7e5e4' }}>
          <div className="overflow-auto scroll-area" style={{ maxHeight: '70vh' }}>
            <div style={{ width: LEFT_W + range.total * DAY_W, position: 'relative' }}>
              {/* Header */}
              <div className="sticky top-0 z-20"
                style={{ background: '#fafaf7', borderBottom: '1px solid #e7e5e4', height: HEADER_H }}>
                <div className="flex">
                  <div className="sticky left-0 z-30 flex items-center px-4 font-display text-sm font-semibold"
                    style={{ width: LEFT_W, background: '#fafaf7', borderRight: '1px solid #e7e5e4', height: HEADER_H }}>
                    Tâche
                  </div>
                  <div style={{ position: 'relative', height: HEADER_H }}>
                    {/* Top band */}
                    <div className="flex" style={{ height: headerRows.bottom ? HEADER_H / 2 : HEADER_H, borderBottom: headerRows.bottom ? '1px solid #f5f5f4' : 'none' }}>
                      {headerRows.top.map((m, i) => (
                        <div key={i}
                          className="font-medium text-xs flex items-center px-2"
                          style={{ width: m.count * DAY_W, color: '#57534e', borderRight: '1px solid #f5f5f4', textTransform: 'capitalize', minWidth: 0, overflow: 'hidden' }}>
                          <span className="truncate">{m.label || m.key}</span>
                        </div>
                      ))}
                    </div>
                    {/* Bottom band */}
                    {headerRows.bottom === 'days' && (
                      <div className="flex" style={{ height: HEADER_H / 2 }}>
                        {days.map((d, i) => {
                          const isWeekend = d.getDay() === 0 || d.getDay() === 6;
                          const isToday = i === todayOffset;
                          return (
                            <div key={i}
                              className="flex flex-col items-center justify-center text-[10px]"
                              style={{
                                width: DAY_W, borderRight: '1px solid #f5f5f4',
                                background: isToday ? '#fef3c7' : isWeekend ? '#fafaf7' : 'transparent',
                                color: isToday ? '#b45309' : isWeekend ? '#a8a29e' : '#57534e',
                                fontWeight: isToday ? 600 : 400,
                              }}>
                              <span>{d.getDate()}</span>
                            </div>
                          );
                        })}
                      </div>
                    )}
                    {headerRows.bottom && headerRows.bottom !== 'days' && (
                      <div className="flex" style={{ height: HEADER_H / 2 }}>
                        {headerRows.bottom.map((m, i) => (
                          <div key={i}
                            className="flex items-center justify-center text-[10px] font-medium"
                            style={{
                              width: m.count * DAY_W, borderRight: '1px solid #f5f5f4',
                              color: '#78716c', textTransform: 'capitalize',
                              minWidth: 0, overflow: 'hidden',
                            }}>
                            <span className="truncate">{m.label}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>

              <div style={{ position: 'relative' }}>
                {/* Weekend & today overlay - only in day mode */}
                <div style={{ position: 'absolute', top: 0, left: LEFT_W, right: 0, bottom: 0, pointerEvents: 'none' }}>
                  {zoomLevel === 'day' && days.map((d, i) => {
                    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
                    if (!isWeekend) return null;
                    return (
                      <div key={i}
                        style={{
                          position: 'absolute', left: i * DAY_W, top: 0,
                          width: DAY_W, height: chartHeight, background: '#fafaf7',
                        }} />
                    );
                  })}
                  {todayInRange && (
                    <div style={{
                      position: 'absolute', left: todayOffset * DAY_W + DAY_W / 2, top: 0,
                      width: 1, height: chartHeight, background: '#d97706', opacity: 0.5,
                    }} />
                  )}
                </div>

                {groups.map((g) => {
                  // A group is hidden if its folder OR any ancestor is collapsed.
                  const hidden = g.folder && isFolderHidden(g.folder.id, folders, collapsedFolders);
                  if (hidden) return null;
                  const isCollapsed = g.folder && collapsedFolders[g.folder.id];
                  const depth = g.depth || 0;
                  return (
                    <React.Fragment key={g.folder?.id || 'none'}>
                      <div className="flex" style={{ height: FOLDER_H, borderBottom: '1px solid #e7e5e4' }}>
                        <div className="sticky left-0 z-10 flex items-center gap-2 px-3"
                          style={{
                            width: LEFT_W,
                            background: g.folder ? (depth === 0 ? '#f5f5f4' : '#fafaf7') : '#fafaf7',
                            borderRight: '1px solid #e7e5e4',
                            paddingLeft: 12 + depth * 14,
                          }}>
                          {g.folder ? (
                            <button onClick={() => toggleFolderCollapse(g.folder.id)}
                              className="flex items-center gap-1.5 text-xs font-semibold w-full text-left"
                              style={{ color: '#1c1917' }}>
                              {isCollapsed ? <ChevronRight size={12} /> : <ChevronDown size={12} />}
                              <Folder size={12} />
                              <span className="truncate flex-1">{g.folder.name}</span>
                              <span className="text-[10px] font-normal" style={{ color: '#78716c' }}>{g.tasks.length}</span>
                            </button>
                          ) : (
                            <span className="text-xs italic font-medium" style={{ color: '#78716c' }}>
                              Sans dossier · {g.tasks.length}
                            </span>
                          )}
                        </div>
                        <div style={{ flex: 1, background: g.folder ? (depth === 0 ? '#f5f5f4' : '#fafaf7') : '#fafaf7' }} />
                      </div>

                      {!isCollapsed && g.tasks.map((t) => {
                        const p = posFor(t);
                        const c = colorFor(t.assignee, people);
                        const isSelected = selectedTask && selectedTask.id === t.id;
                        const isRelated = selectedTask &&
                          ((selectedTask.deps || []).includes(t.id) || (t.deps || []).includes(selectedTask.id));
                        const hasDeps = (t.deps || []).length > 0;
                        return (
                          <div key={t.id} className="flex"
                            style={{ height: ROW_H, borderBottom: '1px solid #f5f5f4', position: 'relative' }}>
                            <div className="sticky left-0 z-10 flex items-center px-4 gap-2"
                              style={{
                                width: LEFT_W,
                                background: isSelected ? '#fef3c7' : isRelated ? '#fffbeb' : '#fff',
                                borderRight: '1px solid #e7e5e4',
                              }}>
                              <div className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{ background: c.bar }} />
                              <div className="min-w-0 flex-1">
                                <div className="text-xs font-medium truncate">{t.name}</div>
                                <div className="text-[10px] truncate" style={{ color: '#a8a29e' }}>{t.assignee}</div>
                              </div>
                            </div>
                            <div style={{ position: 'relative', flex: 1 }}>
                              <GanttBar
                                task={t}
                                color={c}
                                posLeft={p.left}
                                posWidth={p.width}
                                ROW_H={ROW_H}
                                DAY_W={DAY_W}
                                openEnded={p.openEnded}
                                isSelected={isSelected}
                                isRelated={isRelated}
                                hasDeps={hasDeps}
                                onSelect={setSelectedId}
                                commitDrag={commitDrag}
                              />
                            </div>
                          </div>
                        );
                      })}
                    </React.Fragment>
                  );
                })}
              </div>
            </div>
          </div>
        </div>

        <p className="text-xs mt-3 px-1 flex items-center gap-3 flex-wrap" style={{ color: '#78716c' }}>
          <span className="inline-flex items-center gap-1">
            <span className="w-2 h-2 rounded-full" style={{ background: '#d97706' }} />Aujourd'hui
          </span>
          <span className="inline-flex items-center gap-1"><Link2 size={11} />Avec dépendances (début bloqué)</span>
          <span className="inline-flex items-center gap-1"><ArrowRight size={11} />Sans date de fin</span>
          <span>· Glisse les bords pour redimensionner, le milieu pour déplacer</span>
        </p>
      </div>

      {selectedTask && (
        <SidePanel
          task={selectedTask}
          effective={effectiveDates.get(selectedTask.id) || { start: selectedTask.start, end: selectedTask.end }}
          color={colorFor(selectedTask.assignee, people)}
          folder={folders.find((f) => f.id === selectedTask.folderId)}
          blockedBySelected={blockedBySelected} blockingSelected={blockingSelected}
          effectiveDates={effectiveDates}
          tasks={tasks} people={people} onSelect={setSelectedId}
          onEdit={() => startEdit(selectedTask.id)}
          onClose={() => setSelectedId(null)} />
      )}
    </div>
  );
}

function SidePanel({ task, effective, color, folder, blockedBySelected, blockingSelected, effectiveDates, people, onSelect, onEdit, onClose }) {
  return (
    <div className="lg:col-span-1">
      <div className="rounded-xl border p-5 sticky" style={{ background: '#fff', borderColor: '#e7e5e4', top: '1rem' }}>
        <div className="flex items-start justify-between gap-3 mb-4">
          <div className="flex items-start gap-2 min-w-0 flex-1">
            <div className="w-1 self-stretch rounded-full flex-shrink-0 mt-1"
              style={{ background: color.bar, minHeight: 24 }} />
            <div className="min-w-0">
              {folder && (
                <div className="flex items-center gap-1 mb-1 text-[10px] uppercase tracking-wider" style={{ color: '#a8a29e' }}>
                  <Folder size={9} />{folder.name}
                </div>
              )}
              <h3 className="font-display text-lg font-semibold leading-tight">{task.name}</h3>
              <div className="flex items-center gap-1.5 mt-1 text-xs" style={{ color: '#78716c' }}>
                <User size={11} />{task.assignee}
              </div>
            </div>
          </div>
          <div className="flex gap-1">
            <button onClick={onEdit} className="p-1.5 rounded-md hover:bg-stone-100" style={{ color: '#57534e' }} title="Modifier">
              <Pencil size={14} />
            </button>
            <button onClick={onClose} className="p-1.5 rounded-md hover:bg-stone-100" style={{ color: '#78716c' }} title="Fermer">
              <X size={15} />
            </button>
          </div>
        </div>

        <div className="space-y-2 text-xs mb-5 pb-5 border-b" style={{ borderColor: '#f5f5f4' }}>
          <DetailRow label="Début" value={
            <span className="flex items-center gap-1">
              {fmt(effective.start)}
              {effective.shifted && <Lock size={10} style={{ color: '#a8a29e' }} />}
            </span>
          } />
          <DetailRow label="Fin" value={effective.end ? fmt(effective.end) : <span className="italic" style={{ color: '#a8a29e' }}>Non définie</span>} />
          <DetailRow label="Durée" value={durationTextFor(effective.start, effective.end)} />
        </div>

        <RelationSection title="Dépend de" subtitle="Ces tâches doivent être finies avant"
          items={blockingSelected} empty="Aucune dépendance"
          effectiveDates={effectiveDates}
          people={people} onSelect={onSelect} icon={<ArrowRight size={12} />} />
        <div className="my-4" />
        <RelationSection title="Bloque" subtitle="Ces tâches attendent celle-ci"
          items={blockedBySelected} empty="Aucune tâche bloquée"
          effectiveDates={effectiveDates}
          people={people} onSelect={onSelect} icon={<ArrowRight size={12} />} />
      </div>
    </div>
  );
}

function DetailRow({ label, value }) {
  return (
    <div className="flex items-center justify-between">
      <span style={{ color: '#a8a29e' }}>{label}</span>
      <span className="font-medium" style={{ color: '#1c1917' }}>{value}</span>
    </div>
  );
}

function RelationSection({ title, subtitle, items, empty, effectiveDates, people, onSelect, icon }) {
  return (
    <div>
      <div className="flex items-baseline justify-between mb-1">
        <h4 className="text-xs font-semibold uppercase tracking-wider" style={{ color: '#1c1917' }}>{title}</h4>
        <span className="text-[10px]" style={{ color: '#a8a29e' }}>{items.length}</span>
      </div>
      <p className="text-[11px] mb-2" style={{ color: '#a8a29e' }}>{subtitle}</p>

      {items.length === 0 ? (
        <p className="text-xs italic" style={{ color: '#a8a29e' }}>{empty}</p>
      ) : (
        <div className="space-y-1.5">
          {items.map((t) => {
            const c = colorFor(t.assignee, people);
            const eff = effectiveDates.get(t.id) || { start: t.start, end: t.end };
            return (
              <button key={t.id} onClick={() => onSelect(t.id)}
                className="w-full text-left rounded-md border px-2.5 py-2 flex items-center gap-2 transition-colors hover:bg-stone-50"
                style={{ borderColor: '#e7e5e4', background: '#fafaf7' }}>
                <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{ background: c.bar }} />
                <div className="flex-1 min-w-0">
                  <div className="text-xs font-medium truncate">{t.name}</div>

      )}
    </div>
  );
}

// === Folder tree sidebar for the diagram ===
function FolderTreeSidebar({ folders, folderTree, tasks, selectedFolderId, setSelectedFolderId, collapsedFolders, toggleFolderCollapse, profile }) {
  // Count tasks for "All", "None", each folder (including descendants).
  const allCount = tasks.length;
  const noneCount = tasks.filter((t) => !t.folderId).length;
  const myCount = profile.pseudo
    ? tasks.filter((t) => t.assignee.toLowerCase() === profile.pseudo.toLowerCase()).length
    : 0;

  function countFor(folderId) {
    const descendants = getDescendantFolderIds(folderId, folders);
    descendants.add(folderId);
    return tasks.filter((t) => t.folderId && descendants.has(t.folderId)).length;
  }

  function Item({ id, label, icon, count, depth, hasChildren, collapsed, onToggleCollapse, italic }) {
    const selected = selectedFolderId === id;
    return (
      <div className="flex items-center gap-1 rounded-md text-xs hover:bg-stone-50"
        style={{
          paddingLeft: 6 + depth * 14,
          paddingRight: 8,
          background: selected ? '#1c1917' : 'transparent',
          color: selected ? '#fafaf7' : '#1c1917',
        }}>
        {hasChildren ? (
          <button onClick={onToggleCollapse}
            className="p-0.5 -ml-0.5"
            style={{ color: selected ? '#fafaf7' : '#78716c' }}>
            {collapsed ? <ChevronRight size={10} /> : <ChevronDown size={10} />}
          </button>
        ) : (
          <span style={{ width: 14 }} />
        )}
        <button onClick={() => setSelectedFolderId(id)}
          className="flex items-center gap-1.5 flex-1 py-1.5 text-left min-w-0">
          {icon}
          <span className={italic ? 'truncate italic' : 'truncate'}>{label}</span>
          <span className="text-[9px] ml-auto"
            style={{ color: selected ? '#fafaf7' : '#a8a29e', opacity: selected ? 0.7 : 1 }}>
            {count}
          </span>
        </button>
      </div>
    );
  }

  return (
    <div className="rounded-xl border p-2" style={{ background: '#fff', borderColor: '#e7e5e4' }}>
      <div className="px-2 pt-1 pb-2 flex items-center gap-1.5">
        <Folder size={12} style={{ color: '#57534e' }} />
        <h3 className="font-display text-sm font-semibold">Dossiers</h3>
      </div>

      <div className="space-y-0.5">
        <Item id="__all__" label="Toutes les tâches" icon={<ListChecks size={11} />} count={allCount} depth={0} />
        {profile.pseudo && (
          <Item id="__me__" label={'Mes tâches (' + profile.pseudo + ')'} icon={<User size={11} />} count={myCount} depth={0} italic />
        )}
        <div className="border-t my-1" style={{ borderColor: '#f5f5f4' }} />
        {folderTree.map(({ folder, depth }) => {
          // Hide if any ancestor is collapsed
          const hidden = isFolderHidden(folder.id, folders, collapsedFolders) && !collapsedFolders[folder.id];
          if (hidden) return null;
          const hasChildren = folders.some((f) => f.parentId === folder.id);
          return (
            <Item
              key={folder.id}
              id={folder.id}
              label={folder.name}
              icon={<Folder size={11} />}
              count={countFor(folder.id)}
              depth={depth}
              hasChildren={hasChildren}
              collapsed={collapsedFolders[folder.id]}
              onToggleCollapse={() => toggleFolderCollapse(folder.id)}
            />
          );
        })}
        {noneCount > 0 && (
          <>
            <div className="border-t my-1" style={{ borderColor: '#f5f5f4' }} />
            <Item id="__none__" label="Sans dossier" icon={<Folder size={11} />} count={noneCount} depth={0} italic />
          </>
        )}
      </div>
    </div>
  );
}

// === Profile modal (local profile + contacts) ===
function ProfileModal({ profile, setProfile, isAdmin, userEmail, adminsList, setAdminsList, profilesMap, onClose }) {
  const [pseudo, setPseudo] = useState(profile.pseudo || '');
  const [newAdminEmail, setNewAdminEmail] = useState('');

  // Email is bound to the auth account and can't be changed
  const email = userEmail || profile.email || '';

  function save() {
    setProfile({ pseudo: pseudo.trim(), email, contacts: [] });
    onClose();
  }

  function addAdmin() {
    const e = newAdminEmail.trim().toLowerCase();
    if (!e) return;
    if (e === ROOT_ADMIN_EMAIL.toLowerCase()) { alert("Cet utilisateur est déjà admin racine."); return; }
    if (adminsList.some(x => x.toLowerCase() === e)) { alert("Cet email est déjà admin."); return; }
    setAdminsList([...adminsList, e]);
    setNewAdminEmail('');
  }
  function removeAdmin(e) {
    setAdminsList(adminsList.filter(x => x.toLowerCase() !== e.toLowerCase()));
  }

  // List of known users (root + admins + registered profiles), shown in admin panel
  const knownUsers = useMemo(() => {
    const set = new Set();
    set.add(ROOT_ADMIN_EMAIL.toLowerCase());
    adminsList.forEach(e => set.add(e.toLowerCase()));
    Object.keys(profilesMap || {}).forEach(e => set.add(e.toLowerCase()));
    return Array.from(set).sort();
  }, [adminsList, profilesMap]);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ background: 'rgba(28, 25, 23, 0.55)' }}
