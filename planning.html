      <div className="rounded-2xl border w-full max-w-lg max-h-[90vh] overflow-hidden flex flex-col"
        style={{ background: '#fff', borderColor: '#e7e5e4' }}
        onClick={(e) => e.stopPropagation()}>
        <div className="flex items-start justify-between gap-3 px-6 pt-5 pb-3 border-b" style={{ borderColor: '#f5f5f4' }}>
          <div className="flex items-start gap-3">
            <div className="w-9 h-9 rounded-lg flex items-center justify-center"
              style={{ background: '#1c1917', color: '#fafaf7' }}>
              <User size={16} />
            </div>
            <div>
              <h2 className="font-display text-xl font-semibold leading-tight">Profil {isAdmin && <span className="text-xs font-bold ml-2 px-2 py-0.5 rounded" style={{ background:'#16a34a', color:'#fff' }}>ADMIN</span>}</h2>
              <p className="text-xs mt-0.5" style={{ color: '#78716c' }}>
                Synchronisé avec ton compte&nbsp;: <b>{email || 'non connecté'}</b>
              </p>
            </div>
          </div>
          <button onClick={onClose} className="p-2 rounded-md hover:bg-stone-100" style={{ color: '#78716c' }}>
            <X size={16} />
          </button>
        </div>

        <div className="flex-1 overflow-auto scroll-area px-6 py-4 space-y-5">
          {/* Identity */}
          <div className="space-y-2">
            <h3 className="text-xs font-semibold uppercase tracking-wider" style={{ color: '#57534e' }}>Mon identité</h3>
            <Field label="Pseudo (affiché dans les tâches)">
              <input type="text" value={pseudo}
                onChange={(e) => setPseudo(e.target.value)}
                placeholder="Ex : Marie"
                className="w-full px-3 py-2 text-sm rounded-md border outline-none"
                style={{ borderColor: '#d6d3d1', background: '#fafaf7' }} />
            </Field>
            <Field label="Email (lié à ton compte, non modifiable)">
              <input type="email" value={email} readOnly disabled
                className="w-full px-3 py-2 text-sm rounded-md border outline-none cursor-not-allowed"
                style={{ borderColor: '#d6d3d1', background: '#f1f5f9', color: '#64748b' }} />
            </Field>
          </div>

          {/* Admin section (admins only) */}
          {isAdmin && (
            <div className="space-y-2">
              <h3 className="text-xs font-semibold uppercase tracking-wider" style={{ color: '#16a34a' }}>👑 Gestion des administrateurs</h3>
              <p className="text-[11px]" style={{ color: '#78716c' }}>
                Les administrateurs peuvent créer/modifier toutes les tâches, gérer la chronologie et utiliser l'assistant IA.
              </p>

              {/* Root admin (always present, not removable) */}
              <div className="flex items-center gap-2 px-2 py-1.5 rounded-md" style={{ background: '#f0fdf4' }}>
                <span className="text-sm font-medium">{ROOT_ADMIN_EMAIL}</span>
                <span className="text-[10px] font-bold px-1.5 py-0.5 rounded ml-1" style={{ background:'#16a34a', color:'#fff' }}>RACINE</span>
              </div>
              {/* Other admins */}
              {adminsList.map((e, i) => (
                <div key={i} className="flex items-center gap-2 px-2 py-1.5 rounded-md" style={{ background: '#fafaf7' }}>
                  <span className="text-sm">{e}</span>
                  <button onClick={() => removeAdmin(e)}
                    className="ml-auto p-1 rounded hover:bg-stone-200" style={{ color: '#a8a29e' }}
                    title="Retirer le statut d'admin">
                    <X size={11} />
                  </button>
                </div>
              ))}
              <div className="flex gap-2 mt-1">
                <input value={newAdminEmail}
                  onChange={(e) => setNewAdminEmail(e.target.value)}
                  placeholder="email@exemple.fr"
                  className="flex-1 px-3 py-2 text-sm rounded-md border outline-none"
                  style={{ borderColor: '#d6d3d1', background: '#fafaf7' }} />
                <button onClick={addAdmin}
                  disabled={!newAdminEmail.trim()}
                  className="px-3 py-2 rounded-md text-xs font-semibold flex items-center gap-1"
                  style={{ background: '#16a34a', color: '#fff', opacity: newAdminEmail.trim() ? 1 : 0.5 }}>
                  <Plus size={11} />Promouvoir admin
                </button>
              </div>

              {/* Quick-pick from known users */}
              {knownUsers.length > 1 && (
                <div className="mt-2">
                  <p className="text-[11px] mb-1" style={{ color:'#78716c' }}>Utilisateurs connus&nbsp;:</p>
                  <div className="flex flex-wrap gap-1">
                    {knownUsers
                      .filter(u => u !== ROOT_ADMIN_EMAIL.toLowerCase() && !adminsList.some(a => a.toLowerCase() === u))
                      .map(u => (
                        <button key={u} onClick={() => setNewAdminEmail(u)}
                          className="text-[11px] px-2 py-0.5 rounded border"
                          style={{ borderColor:'#d6d3d1', background:'#fff', color:'#57534e' }}>
                          {u}
                        </button>
                      ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {!isAdmin && (
            <div className="rounded-lg p-3 text-[11px] leading-relaxed"
              style={{ background: '#fef3c7', color: '#78350f', border: '1px solid #fcd34d' }}>
              <p className="font-semibold mb-1">ℹ️ Mode utilisateur</p>
              <p>
                Tu peux créer et modifier <b>tes propres tâches</b> (assignées à <b>{email}</b>).
                Tu ne peux pas modifier la chronologie ni les tâches des autres. Demande à un administrateur pour ces opérations.
              </p>
            </div>
          )}
        </div>

        <div className="px-6 py-4 border-t flex items-center justify-end gap-2" style={{ borderColor: '#f5f5f4', background: '#fafaf7' }}>
          <button onClick={onClose}
            className="px-4 py-2 rounded-md text-sm font-medium"
            style={{ background: 'transparent', color: '#78716c' }}>
            Annuler
          </button>
          <button onClick={save}
            className="px-4 py-2 rounded-md text-sm font-semibold flex items-center gap-2"
            style={{ background: '#1c1917', color: '#fafaf7' }}>
            <Check size={14} />Enregistrer
          </button>
        </div>
      </div>
    </div>
  );
}

// === Chronology view ===
// A user can create several timelines (frises). Each contains events that can have
// a start date and optionally an end date. Events can be dragged on the timeline
// to update their dates. Each event has a free-text comment.
const EVENT_PALETTE = [
  '#0d9488', '#0284c7', '#d97706', '#db2777',
  '#7c3aed', '#65a30d', '#dc2626', '#0891b2',
];

// Same logic as computeEffectiveDates for tasks, but for chronology events.
// An event's effective start = max(its own start, max(effective end of parents)).
// End shifts by the same delta to preserve duration.
function computeEffectiveEventDates(events) {
  const byId = new Map(events.map((e) => [e.id, e]));
  const cache = new Map();
  const computing = new Set();
  function compute(id) {
    if (cache.has(id)) return cache.get(id);
    if (computing.has(id)) {
      const e = byId.get(id);
      return { start: e.start, end: e.end, shifted: false };
    }
    computing.add(id);
    const e = byId.get(id);
    if (!e) { computing.delete(id); return null; }
    let startMs = parseDate(e.start).getTime();
    (e.deps || []).forEach((depId) => {
      const dep = compute(depId);
      if (!dep) return;
      const depEndMs = dep.end ? parseDate(dep.end).getTime() : parseDate(dep.start).getTime();
      if (depEndMs > startMs) startMs = depEndMs;
    });
    const origStartMs = parseDate(e.start).getTime();
    const dShift = startMs - origStartMs;
    const newStart = toISO(new Date(startMs));
    let newEnd = e.end;
    if (e.end && dShift !== 0) {
      newEnd = toISO(new Date(parseDate(e.end).getTime() + dShift));
    }
    const result = { start: newStart, end: newEnd, shifted: dShift !== 0 };
    cache.set(id, result);
    computing.delete(id);
    return result;
  }
  events.forEach((e) => compute(e.id));
  return cache;
}

function ChronologyView({
  timelines, activeTimelineId, setActiveTimelineId,
  createTimeline, renameTimeline, deleteTimeline,
  addEvent, updateEvent, deleteEvent,
  isAdmin,
}) {
  const [newTimelineName, setNewTimelineName] = useState('');
  const [renamingId, setRenamingId] = useState(null);
  const [renameValue, setRenameValue] = useState('');
  const [selectedEventId, setSelectedEventId] = useState(null);
  const [chronoZoom, setChronoZoom] = useState('auto'); // 'auto' | 'day' | 'month' | 'year'

  // New event form
  const [eventForm, setEventForm] = useState({
    name: '', start: todayStr(), end: '', comment: '', deps: [],
  });
  const [formError, setFormError] = useState('');
  const [depDropdownOpen, setDepDropdownOpen] = useState(false);

  const active = timelines.find((t) => t.id === activeTimelineId) || null;
  const activeEvents = active?.events || [];

  // Effective dates of all events in the active timeline (cascading deps)
  const effectiveEventDates = useMemo(
    () => computeEffectiveEventDates(activeEvents),
    [activeEvents]
  );

  // Reset selected event when timeline changes
  useEffect(() => { setSelectedEventId(null); }, [activeTimelineId]);

  // Auto-update form start when deps change
  useEffect(() => {
    if (eventForm.deps.length === 0) return;
    let maxMs = 0;
    eventForm.deps.forEach((depId) => {
      const dep = activeEvents.find((e) => e.id === depId);
      if (!dep) return;
      const eff = effectiveEventDates.get(depId);
      const dateStr = (eff && eff.end) || (eff && eff.start) || dep.end || dep.start;
      const ms = parseDate(dateStr).getTime();
      if (ms > maxMs) maxMs = ms;
    });
    if (maxMs > 0) {
      const newStart = toISO(new Date(maxMs));
      if (newStart !== eventForm.start) {
        setEventForm((f) => ({ ...f, start: newStart }));
      }
    }
    // eslint-disable-next-line
  }, [eventForm.deps, activeEvents]);

  function toggleEventDep(id) {
    setEventForm((f) =>
      f.deps.includes(id)
        ? { ...f, deps: f.deps.filter((d) => d !== id) }
        : { ...f, deps: [...f.deps, id] }
    );
  }

  function addNewEvent() {
    setFormError('');
    if (!active) { setFormError('Crée d\'abord une frise.'); return; }
    if (!eventForm.name.trim()) { setFormError('Donne un titre à l\'objectif.'); return; }
    if (!eventForm.start) { setFormError('Précise une date de début.'); return; }
    if (eventForm.end && parseDate(eventForm.end) < parseDate(eventForm.start)) {
      setFormError('La date de fin doit être après le début.');
      return;
    }
    const newEvent = {
      name: eventForm.name.trim(),
      start: eventForm.start,
      end: eventForm.end || null,
      comment: eventForm.comment.trim() || '',
      deps: eventForm.deps,
      color: EVENT_PALETTE[(active.events.length) % EVENT_PALETTE.length],
    };
    addEvent(active.id, newEvent);
    // Pre-fill next event's start with the end of the just-created one
    // (or its start if no end was set).
    const nextStart = newEvent.end || newEvent.start;
    setEventForm({ name: '', start: nextStart, end: '', comment: '', deps: [] });
    setDepDropdownOpen(false);
  }

  if (timelines.length === 0) {
    return (
      <div className="rounded-xl border-2 border-dashed p-12 text-center max-w-xl mx-auto"
        style={{ borderColor: '#e7e5e4' }}>
        <div className="flex justify-center mb-3" style={{ color: '#a8a29e' }}>
          <Calendar size={36} />
        </div>
        <h2 className="font-display text-lg font-semibold mb-1">Aucune frise pour l'instant</h2>
        <p className="text-sm mb-4" style={{ color: '#78716c' }}>
          Crée ta première frise chronologique pour suivre tes objectifs.
        </p>
        <div className="flex gap-2 max-w-sm mx-auto">
          <input type="text" value={newTimelineName}
            onChange={(e) => setNewTimelineName(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter' && newTimelineName.trim()) { createTimeline(newTimelineName.trim()); setNewTimelineName(''); } }}
            placeholder="Nom de la frise"
            className="flex-1 px-3 py-2 text-sm rounded-md border outline-none"
            style={{ borderColor: '#d6d3d1', background: '#fafaf7' }} />
          <button onClick={() => { if (newTimelineName.trim()) { createTimeline(newTimelineName.trim()); setNewTimelineName(''); } }}
            disabled={!newTimelineName.trim()}
            className="px-4 py-2 rounded-md text-sm font-semibold"
            style={{ background: '#1c1917', color: '#fafaf7', opacity: newTimelineName.trim() ? 1 : 0.5 }}>
            Créer
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className={"space-y-4" + (!isAdmin ? " chrono-readonly" : "")}>
      {!isAdmin && (
        <div className="rounded-lg p-3 text-sm flex items-center gap-2"
          style={{ background:'#fef3c7', border:'1px solid #fcd34d', color:'#78350f' }}>
          <span>🔒</span>
          <span>Mode lecture seule&nbsp;: la chronologie est gérée par les administrateurs.</span>
        </div>
      )}
      {/* Timeline tabs */}
      <div className="rounded-xl border p-2 flex items-center gap-1 flex-wrap"
        style={{ background: '#fff', borderColor: '#e7e5e4' }}>
        {timelines.map((tl) => {
          const isActive = tl.id === activeTimelineId;
          const isRenaming = renamingId === tl.id;
          return (
            <div key={tl.id}
              className="px-2.5 py-1 rounded-md text-sm font-medium flex items-center gap-1.5"
              style={{
                background: isActive ? '#1c1917' : 'transparent',
                color: isActive ? '#fafaf7' : '#57534e',
              }}>
              {isRenaming ? (
                <input autoFocus value={renameValue}
                  onChange={(e) => setRenameValue(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter' && renameValue.trim()) {
                      renameTimeline(tl.id, renameValue.trim());
                      setRenamingId(null);
                    } else if (e.key === 'Escape') {
                      setRenamingId(null);
                    }
                  }}
                  onBlur={() => {
                    if (renameValue.trim()) renameTimeline(tl.id, renameValue.trim());
                    setRenamingId(null);
                  }}
                  className="px-2 py-0.5 text-sm rounded outline-none"
                  style={{ background: '#fafaf7', color: '#1c1917', minWidth: 100 }} />
              ) : (
                <button onClick={() => setActiveTimelineId(tl.id)}
                  onDoubleClick={() => { setRenamingId(tl.id); setRenameValue(tl.name); }}
                  className="flex items-center gap-1.5">
                  <Calendar size={12} />
                  {tl.name}
                  <span className="text-[10px] opacity-70">· {tl.events.length}</span>
                </button>
              )}
              {isActive && !isRenaming && (
                <>
                  <button onClick={() => { setRenamingId(tl.id); setRenameValue(tl.name); }}
                    className="p-0.5 rounded hover:bg-stone-700"
                    style={{ color: '#fafaf7' }} title="Renommer">
                    <Pencil size={10} />
                  </button>
                  <button onClick={() => {
                    if (tl.events.length === 0 || confirm('Supprimer la frise "' + tl.name + '" et ses ' + tl.events.length + ' événement(s) ?'))
                      deleteTimeline(tl.id);
                  }}
                    className="p-0.5 rounded hover:bg-stone-700"
                    style={{ color: '#fafaf7' }} title="Supprimer">
                    <X size={10} />
                  </button>
                </>
              )}
            </div>
          );
        })}

        <div className="flex items-center gap-1 ml-2 pl-2 border-l" style={{ borderColor: '#e7e5e4' }}>
          <input type="text" value={newTimelineName}
            onChange={(e) => setNewTimelineName(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === 'Enter' && newTimelineName.trim()) {
                createTimeline(newTimelineName.trim());
                setNewTimelineName('');
              }
            }}
            placeholder="Nouvelle frise..."
            className="px-2 py-1 text-xs rounded-md border outline-none"
            style={{ borderColor: '#d6d3d1', background: '#fafaf7', width: 130 }} />
          <button onClick={() => {
            if (newTimelineName.trim()) {
              createTimeline(newTimelineName.trim());
              setNewTimelineName('');
            }
          }}
            disabled={!newTimelineName.trim()}
            className="p-1.5 rounded-md"
            style={{ background: '#1c1917', color: '#fafaf7', opacity: newTimelineName.trim() ? 1 : 0.4 }}
            title="Créer la frise">
            <Plus size={12} />
          </button>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-7 gap-4">
        {/* Left: add event form */}
        <section className="lg:col-span-2 space-y-3">
          <div className="rounded-xl border p-4" style={{ background: '#fff', borderColor: '#e7e5e4' }}>
            <h3 className="font-display text-base font-semibold mb-3">Nouvel objectif</h3>
            <div className="space-y-2">
              <Field label="Titre">
                <input type="text" value={eventForm.name}
                  onChange={(e) => setEventForm({ ...eventForm, name: e.target.value })}
                  placeholder="Ex: Lancement bêta"
                  className="w-full px-3 py-2 text-sm rounded-md border outline-none"
                  style={{ borderColor: '#d6d3d1', background: '#fafaf7' }} />
              </Field>
              <div className="grid grid-cols-2 gap-2">
                <Field label="Début" hint={eventForm.deps.length > 0 ? 'auto' : undefined}>
                  <div className="relative">
                    <input type="date" value={eventForm.start}
                      onChange={(e) => setEventForm({ ...eventForm, start: e.target.value })}
                      disabled={eventForm.deps.length > 0}
                      className="w-full px-2 py-2 text-xs rounded-md border outline-none"
                      style={{
                        borderColor: '#d6d3d1',
                        background: eventForm.deps.length > 0 ? '#f5f5f4' : '#fafaf7',
                        color: eventForm.deps.length > 0 ? '#78716c' : '#1c1917',
                        cursor: eventForm.deps.length > 0 ? 'not-allowed' : 'auto',
                      }} />
                    {eventForm.deps.length > 0 && (
                      <span className="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none" style={{ color: '#a8a29e' }}>
                        <Lock size={11} />
                      </span>
                    )}
                  </div>
                </Field>
                <Field label="Fin" hint="optionnel">
                  <div className="relative">
                    <input type="date" value={eventForm.end}
                      onChange={(e) => setEventForm({ ...eventForm, end: e.target.value })}
                      className="w-full px-2 py-2 text-xs rounded-md border outline-none"
                      style={{ borderColor: '#d6d3d1', background: '#fafaf7' }} />
                    {eventForm.end && (
                      <button onClick={() => setEventForm({ ...eventForm, end: '' })}
                        className="absolute right-1 top-1/2 -translate-y-1/2 p-1 rounded hover:bg-stone-100"
                        style={{ color: '#a8a29e' }}>
                        <X size={10} />
                      </button>
                    )}
                  </div>
                </Field>
              </div>

              <Field label="Bloqué par (rattachement)">
                <div>
                  <button type="button" onClick={() => setDepDropdownOpen(!depDropdownOpen)}
                    className="w-full px-3 py-2 text-xs rounded-md border text-left flex items-center justify-between"
                    style={{ borderColor: '#d6d3d1', background: '#fafaf7' }}
                    disabled={activeEvents.length === 0}>
                    <span style={{ color: eventForm.deps.length ? '#1c1917' : '#a8a29e' }}>
                      {activeEvents.length === 0
                        ? 'Aucun objectif à choisir'
                        : eventForm.deps.length === 0
                        ? 'Aucun (optionnel)'
                        : eventForm.deps.length + ' sélectionné' + (eventForm.deps.length > 1 ? 's' : '')}
                    </span>
                    {depDropdownOpen ? <ChevronUp size={12} style={{ color: '#78716c' }} /> : <ChevronDown size={12} style={{ color: '#78716c' }} />}
                  </button>
                  {depDropdownOpen && activeEvents.length > 0 && (
                    <div className="mt-1 w-full rounded-md border shadow-sm max-h-56 overflow-auto scroll-area"
                      style={{ background: '#fff', borderColor: '#d6d3d1' }}>
                      {activeEvents.map((ev) => {
                        const checked = eventForm.deps.includes(ev.id);
                        return (
                          <label key={ev.id}
                            className="flex items-center gap-2 px-3 py-2 cursor-pointer text-xs hover:bg-stone-50"
                            style={{ borderBottom: '1px solid #f5f5f4' }}>
                            <input type="checkbox" checked={checked} onChange={() => toggleEventDep(ev.id)} />
                            <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: ev.color || '#0d9488' }} />
                            <span className="truncate flex-1">{ev.name}</span>
                            <span className="text-[10px]" style={{ color: '#78716c' }}>
                              {ev.end ? fmt(ev.end) : fmt(ev.start)}
                            </span>
                          </label>
                        );
                      })}
                    </div>
                  )}
                  {eventForm.deps.length > 0 && !depDropdownOpen && (
                    <div className="mt-2 flex flex-wrap gap-1">
                      {eventForm.deps.map((id) => {
                        const ev = activeEvents.find((x) => x.id === id);
                        if (!ev) return null;
                        return (
                          <span key={id} className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs"
                            style={{ background: '#f5f5f4', color: '#57534e' }}>
                            <span className="w-1.5 h-1.5 rounded-full" style={{ background: ev.color || '#0d9488' }} />
                            {ev.name}
                            <button onClick={() => toggleEventDep(id)} className="hover:text-stone-900">
                              <X size={10} />
                            </button>
                          </span>
                        );
                      })}
                    </div>
                  )}
                </div>
              </Field>
              <Field label="Commentaire" hint="optionnel">
                <textarea value={eventForm.comment}
                  onChange={(e) => setEventForm({ ...eventForm, comment: e.target.value })}
                  rows={3}
                  placeholder="Détails, contexte, notes..."
                  className="w-full px-3 py-2 text-sm rounded-md border outline-none resize-none"
                  style={{ borderColor: '#d6d3d1', background: '#fafaf7' }} />
              </Field>
              {formError && (
                <div className="flex items-start gap-2 text-xs px-3 py-2 rounded-md"
                  style={{ background: '#fef2f2', color: '#b91c1c' }}>
                  <AlertCircle size={14} className="mt-0.5 flex-shrink-0" />
                  <span>{formError}</span>
                </div>
              )}
              <button onClick={addNewEvent}
                className="w-full py-2 rounded-md text-sm font-semibold flex items-center justify-center gap-1.5"
                style={{ background: '#1c1917', color: '#fafaf7' }}>
                <Plus size={13} />Ajouter à "{active?.name || '?'}"
              </button>
            </div>
          </div>
        </section>

        {/* Right: timeline canvas + event list */}
        <section className="lg:col-span-5 space-y-3">
          {active && (
            <TimelineCanvas
              timeline={active}
              effectiveEventDates={effectiveEventDates}
              selectedEventId={selectedEventId}
              setSelectedEventId={setSelectedEventId}
              zoom={chronoZoom} setZoom={setChronoZoom}
              updateEvent={(eventId, patch) => updateEvent(active.id, eventId, patch)}
              deleteEvent={(eventId) => deleteEvent(active.id, eventId)}
            />
          )}
        </section>
      </div>
    </div>
  );
}

// === Timeline canvas: horizontal milestone-style frise ===
// Events with no end date are rendered as a single vertical tick (milestone)
// on the central line, with their label stacked above or below.
// Events with an end date are rendered as a horizontal arrow span above the line.
function TimelineCanvas({ timeline, effectiveEventDates, selectedEventId, setSelectedEventId, zoom, setZoom, updateEvent, deleteEvent }) {
  const events = timeline.events || [];

  // Use effective dates (after applying dependencies) for display
  function effOf(ev) {
    return effectiveEventDates?.get(ev.id) || { start: ev.start, end: ev.end };
  }

  const range = useMemo(() => {
    if (events.length === 0) {
      const today = parseDate(todayStr());
      const min = new Date(today); min.setDate(min.getDate() - 7);
      const max = new Date(today); max.setDate(max.getDate() + 30);
      return { min, max, total: 38 };
    }
    let min = null, max = null;
    events.forEach((e) => {
      const eff = effOf(e);
      const s = parseDate(eff.start);
      const en = eff.end ? parseDate(eff.end) : s;
      if (!min || s < min) min = s;
      if (!max || en > max) max = en;
    });
    const today = parseDate(todayStr());
    if (today < min) min = today;
    if (today > max) max = today;
    min = new Date(min); min.setDate(min.getDate() - 7);
    max = new Date(max); max.setDate(max.getDate() + 10);
    const total = Math.round((max - min) / 86400000) + 1;
    return { min, max, total };
    // eslint-disable-next-line
  }, [events, effectiveEventDates]);

  // Width per day: 'auto' adapts to range, others are forced.
  // - day: spacious, like a calendar (14px/day → 1 month ≈ 420px)
  // - month: compact, monthly markers visible (3px/day → 1 month ≈ 90px)
  // - year: very compact, yearly markers (0.4px/day → 1 year ≈ 146px)
  const DAY_W = useMemo(() => {
    if (zoom === 'day') return 14;
    if (zoom === 'month') return 3;
    if (zoom === 'year') return 0.4;
    // auto
    if (range.total <= 60) return 14;
    if (range.total <= 180) return 6;
    if (range.total <= 365) return 3;
    return 2;
  }, [range.total, zoom]);

  const totalWidth = range.total * DAY_W;
  const PADDING_X = 40;
  const AXIS_Y = 240;       // vertical position of the main horizontal line
  const TICK_HEIGHT = 14;   // height of vertical tick mark
  const MILESTONE_LABEL_GAP = 18;

  // Convert a date to x position
  function xFor(dateStr) {
    const offset = Math.round((parseDate(dateStr) - range.min) / 86400000);
    return PADDING_X + offset * DAY_W;
  }

  // Sort milestones (no end) and spans (with end) separately
  const milestones = useMemo(
    () => events.filter((e) => !e.end)
      .sort((a, b) => parseDate(effOf(a).start) - parseDate(effOf(b).start)),
    [events, effectiveEventDates]
  );
  const spans = useMemo(
    () => events.filter((e) => e.end)
      .sort((a, b) => parseDate(effOf(a).start) - parseDate(effOf(b).start)),
    [events, effectiveEventDates]
  );

  // Distribute milestone labels above/below the axis to avoid overlaps.
  // We greedily stack them: each label gets a "lane" index based on whether it
  // collides horizontally with already-placed labels in the same direction.
  const milestonePlacements = useMemo(() => {
    const placements = new Map();
    const upLanes = [];
    const downLanes = [];
    const MIN_LABEL_W = 110;
    milestones.forEach((m, idx) => {
      const x = xFor(effOf(m).start);
      const goUp = idx % 2 === 0;
      const lanes = goUp ? upLanes : downLanes;
      let lane = 0;
      while (lane < lanes.length && lanes[lane].right > x - MIN_LABEL_W / 2) lane++;
      if (lane === lanes.length) lanes.push({ right: 0 });
      lanes[lane] = { right: x + MIN_LABEL_W / 2 };
      placements.set(m.id, { direction: goUp ? 'up' : 'down', lane });
    });
    return placements;
    // eslint-disable-next-line
  }, [milestones, DAY_W, range.min, effectiveEventDates]);

  // Stack spans on rows above the axis to avoid overlap
  const spanPlacements = useMemo(() => {
    const placements = new Map();
    const rows = [];
    spans.forEach((s) => {
      const eff = effOf(s);
      const left = xFor(eff.start);
      const right = xFor(eff.end);
      let row = 0;
      while (row < rows.length && rows[row] > left - 8) row++;
      if (row === rows.length) rows.push(0);
      rows[row] = right;
      placements.set(s.id, { row });
    });
    return { placements, rowCount: rows.length };
    // eslint-disable-next-line
  }, [spans, DAY_W, range.min]);

  // Compute vertical area needed
  const maxUpLane = Math.max(0, ...Array.from(milestonePlacements.values())
    .filter((p) => p.direction === 'up').map((p) => p.lane + 1));
  const maxDownLane = Math.max(0, ...Array.from(milestonePlacements.values())
    .filter((p) => p.direction === 'down').map((p) => p.lane + 1));
  const spanRowH = 26;
  const labelLaneH = 38;

  // Recompute AXIS_Y based on content above
  const computedAxisY = 30 + spanPlacements.rowCount * spanRowH + maxUpLane * labelLaneH + 30;
  const computedHeight = computedAxisY + maxDownLane * labelLaneH + 60;

  const todayOffset = Math.round((parseDate(todayStr()) - range.min) / 86400000);
  const todayInRange = todayOffset >= 0 && todayOffset < range.total;
  const todayX = PADDING_X + todayOffset * DAY_W;

  // Month label band along the axis
  const monthMarkers = useMemo(() => {
    const out = [];
    if (zoom === 'year') {
      // One marker per year on Jan 1st
      const d = new Date(range.min.getFullYear(), 0, 1);
      while (d <= range.max) {
        const offset = Math.round((d - range.min) / 86400000);
        if (offset >= 0 && offset < range.total) {
          out.push({
            x: PADDING_X + offset * DAY_W,
            label: String(d.getFullYear()),
          });
        }
        d.setFullYear(d.getFullYear() + 1);
      }
    } else {
      const d = new Date(range.min);
      d.setDate(1);
      while (d <= range.max) {
        const offset = Math.round((d - range.min) / 86400000);
        if (offset >= 0 && offset < range.total) {
          out.push({
            x: PADDING_X + offset * DAY_W,
            label: d.toLocaleDateString('fr-FR', { month: 'short', year: 'numeric' }),
          });
        }
        d.setMonth(d.getMonth() + 1);
      }
    }
    return out;
  }, [range, DAY_W, zoom]);

  const selectedEvent = events.find((e) => e.id === selectedEventId);

  if (events.length === 0) {
    return (
      <div className="rounded-xl border-2 border-dashed p-10 text-center"
        style={{ borderColor: '#e7e5e4' }}>
        <div className="flex justify-center mb-3" style={{ color: '#a8a29e' }}>
          <Calendar size={32} />
        </div>
        <p className="text-sm" style={{ color: '#78716c' }}>
          La frise "{timeline.name}" est vide.
        </p>
        <p className="text-xs mt-1" style={{ color: '#a8a29e' }}>
          Ajoute un premier objectif à gauche.
        </p>
      </div>
    );
  }

  return (
    <>
      <div className="mb-2 flex items-center gap-2 justify-end">
        <span className="text-[10px] uppercase tracking-wider" style={{ color: '#a8a29e' }}>Échelle</span>
        <div className="flex items-center gap-0.5 p-0.5 rounded-lg" style={{ background: '#f5f5f4' }}>
          {[
            { id: 'auto', label: 'Auto' },
            { id: 'day', label: 'Jour' },
            { id: 'month', label: 'Mois' },
            { id: 'year', label: 'Année' },
          ].map((z) => (
            <button key={z.id} onClick={() => setZoom(z.id)}
              className="px-2.5 py-1 rounded-md text-xs font-medium transition-all"
              style={{
                background: zoom === z.id ? '#fafaf7' : 'transparent',
                color: zoom === z.id ? '#1c1917' : '#57534e',
                boxShadow: zoom === z.id ? '0 1px 2px rgba(0,0,0,0.06)' : 'none',
              }}>
              {z.label}
            </button>
          ))}
        </div>
      </div>
      <div className="rounded-xl border overflow-hidden" style={{ background: '#fff', borderColor: '#e7e5e4' }}>
        <div className="overflow-auto scroll-area">
          <svg
            width={totalWidth + PADDING_X * 2}
            height={computedHeight}
            style={{ display: 'block', background: '#fff' }}>

            {/* Month markers */}
            {monthMarkers.map((m, i) => (
              <g key={i}>
                <line
                  x1={m.x} x2={m.x}
                  y1={computedAxisY - 6} y2={computedAxisY + 6}
                  stroke="#d6d3d1" strokeWidth={1} />
                <text
                  x={m.x} y={computedAxisY + 22}
                  fontSize={10} fill="#a8a29e"
                  textAnchor="middle" fontFamily="DM Sans, sans-serif"
                  style={{ textTransform: 'capitalize' }}>
                  {m.label}
                </text>
              </g>
            ))}

            {/* Today vertical line */}
            {todayInRange && (
              <g>
                <line
                  x1={todayX} x2={todayX}
                  y1={20} y2={computedHeight - 20}
                  stroke="#d97706" strokeWidth={1} strokeDasharray="4 3" opacity={0.6} />
                <text
                  x={todayX} y={14}
                  fontSize={9} fill="#b45309"
                  textAnchor="middle" fontFamily="DM Sans, sans-serif"
                  fontWeight={600}>
                  Aujourd'hui
                </text>
              </g>
            )}

            {/* Main horizontal line with arrow at the end */}
            <defs>
              <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                <polygon points="0 0, 9 3, 0 6" fill="#1c1917" />
              </marker>
            </defs>
            <line
              x1={PADDING_X} x2={PADDING_X + totalWidth}
              y1={computedAxisY} y2={computedAxisY}
              stroke="#1c1917" strokeWidth={1.5}
              markerEnd="url(#arrowhead)" />

            {/* Dependency links: thin dashed lines from blocking event's end
                to the blocked event's start, only when the link is "active"
                (i.e. the dep is actually setting the date of the dependent). */}
            <defs>
              <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
                <polygon points="0 0, 7 2.5, 0 5" fill="#a8a29e" />
              </marker>
            </defs>
            {events.map((ev) => {
              const deps = ev.deps || [];
              if (deps.length === 0) return null;
              const evEff = effOf(ev);
              const evX = xFor(evEff.start);
              return deps.map((depId) => {
                const dep = events.find((e) => e.id === depId);
                if (!dep) return null;
                const depEff = effOf(dep);
                const depEndDate = depEff.end || depEff.start;
                const depX = xFor(depEndDate);
                // Skip if positions are basically the same
                if (Math.abs(evX - depX) < 2 && evX - depX <= 0) return null;
                const isHighlighted = selectedEventId === ev.id || selectedEventId === dep.id;
                return (
                  <path
                    key={ev.id + '_' + depId}
                    d={'M ' + depX + ' ' + (computedAxisY - 2)
                      + ' C ' + depX + ' ' + (computedAxisY - 20) + ', '
                      + evX + ' ' + (computedAxisY - 20) + ', '
                      + evX + ' ' + (computedAxisY - 2)}
                    fill="none"
                    stroke={isHighlighted ? '#d97706' : '#a8a29e'}
                    strokeWidth={isHighlighted ? 1.5 : 1}
                    strokeDasharray="3 3"
                    opacity={isHighlighted ? 0.9 : 0.5}
                    markerEnd="url(#depArrow)" />
                );
              });
            })}

            {/* Span events (with end date): horizontal brackets above the axis */}
            {spans.map((s) => {
              const eff = effOf(s);
              const isSelected = s.id === selectedEventId;
              const placement = spanPlacements.placements.get(s.id);
              const x1 = xFor(eff.start);
              const x2 = xFor(eff.end);
              const y = computedAxisY - 40 - placement.row * spanRowH;
              const color = s.color || '#0d9488';
              const hasDeps = (s.deps || []).length > 0;
              return (
                <SpanElement
                  key={s.id}
                  event={s}
                  effective={eff}
                  x1={x1} x2={x2}
                  y={y}
                  axisY={computedAxisY}
                  color={color}
                  isSelected={isSelected}
                  hasDeps={hasDeps}
                  DAY_W={DAY_W}
                  onSelect={() => setSelectedEventId(s.id)}
                  onChange={(patch) => updateEvent(s.id, patch)}
                />
              );
            })}

            {/* Milestone events (no end date): vertical tick + stacked label */}
            {milestones.map((m) => {
              const eff = effOf(m);
              const isSelected = m.id === selectedEventId;
              const placement = milestonePlacements.get(m.id);
              const x = xFor(eff.start);
              const color = m.color || '#1c1917';
              const hasDeps = (m.deps || []).length > 0;
              return (
                <MilestoneElement
                  key={m.id}
                  event={m}
                  effective={eff}
                  x={x}
                  axisY={computedAxisY}
                  direction={placement.direction}
                  lane={placement.lane}
                  laneH={labelLaneH}
                  tickH={TICK_HEIGHT}
                  color={color}
                  isSelected={isSelected}
                  hasDeps={hasDeps}
                  DAY_W={DAY_W}
                  onSelect={() => setSelectedEventId(m.id)}
                  onChange={(patch) => updateEvent(m.id, patch)}
                />
              );
            })}
          </svg>
        </div>
      </div>

      <p className="text-[11px] px-1" style={{ color: '#78716c' }}>
        Clic sur un jalon = sélectionner · glisser un jalon ou un trait = modifier les dates
      </p>

      {selectedEvent && (
        <ChronoEventDetail
          event={selectedEvent}
          allEvents={events}
          effective={effOf(selectedEvent)}
          effectiveEventDates={effectiveEventDates}
          updateEvent={(patch) => updateEvent(selectedEvent.id, patch)}
          deleteEvent={() => { deleteEvent(selectedEvent.id); setSelectedEventId(null); }}
          onSelect={(id) => setSelectedEventId(id)}
          onClose={() => setSelectedEventId(null)}
        />
      )}
    </>
  );
}

// === Milestone (vertical tick + label) ===
function MilestoneElement({ event, effective, x, axisY, direction, lane, laneH, tickH, color, isSelected, hasDeps, DAY_W, onSelect, onChange }) {
  const [drag, setDrag] = useState(null);

  const startDrag = (e) => {
    e.stopPropagation();
    e.preventDefault();
    if (hasDeps) {
      // Just select, don't allow dragging when locked by a dependency
      onSelect();
      return;
    }
    document.body.classList.add('dragging');
    setDrag({ startX: e.clientX, deltaDays: 0, moved: false });
  };

  useEffect(() => {
    if (!drag) return;
    const onMove = (e) => {
      const dx = e.clientX - drag.startX;
      const deltaDays = Math.round(dx / DAY_W);
      const moved = Math.abs(dx) > 3;
      if (deltaDays !== drag.deltaDays || moved !== drag.moved) {
        setDrag((d) => ({ ...d, deltaDays, moved }));
      }
    };
    const onUp = () => {
      if (drag.moved && drag.deltaDays !== 0) {
        onChange({ start: shiftDate(event.start, drag.deltaDays) });
      } else if (!drag.moved) {
        onSelect();
      }
      document.body.classList.remove('dragging');
      setDrag(null);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
  }, [drag, event, DAY_W, onChange, onSelect]);

  const displayX = x + (drag && drag.moved ? drag.deltaDays * DAY_W : 0);
  const goUp = direction === 'up';
  const tickY1 = goUp ? axisY - tickH : axisY;
  const tickY2 = goUp ? axisY : axisY + tickH;
  // Label position
  const labelDistance = tickH + 6 + lane * laneH;
  const labelY = goUp ? axisY - labelDistance : axisY + labelDistance;

  // Format the (effective) date short
  const dateLabel = parseDate(effective.start).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });

  return (
    <g style={{ cursor: hasDeps ? 'pointer' : 'grab' }} onMouseDown={startDrag}>
      {/* Tick */}
      <line
        x1={displayX} x2={displayX}
        y1={tickY1} y2={tickY2}
        stroke={color}
        strokeWidth={isSelected ? 3 : 2} />
      {/* Dot at the axis intersection */}
      <circle
        cx={displayX} cy={axisY}
        r={isSelected ? 5 : 4}
        fill={color}
        stroke={isSelected ? '#1c1917' : '#fff'}
        strokeWidth={isSelected ? 2 : 1.5} />

      {/* Connector line from tick to label (if multi-lane) */}
      {lane > 0 && (
        <line
          x1={displayX} x2={displayX}
          y1={goUp ? axisY - tickH : axisY + tickH}
          y2={labelY + (goUp ? 12 : -2)}
          stroke="#d6d3d1" strokeWidth={1} strokeDasharray="2 2" />
      )}

      {/* Label group */}
      <g transform={'translate(' + displayX + ',' + labelY + ')'}>
        <text
          x={0} y={goUp ? 0 : 12}
          fontSize={11} fontWeight={600} fill="#1c1917"
          textAnchor="middle" fontFamily="DM Sans, sans-serif">
          {dateLabel}
        </text>
        <text
          x={0} y={goUp ? -14 : 26}
          fontSize={11} fill="#57534e"
          textAnchor="middle" fontFamily="DM Sans, sans-serif">
          {event.name}
        </text>
        {event.comment && (
          <text x={0} y={goUp ? -28 : 38}
            fontSize={9} fill="#a8a29e"
            textAnchor="middle" fontFamily="DM Sans, sans-serif">
            💬
          </text>
        )}
      </g>

      {/* Invisible larger hit area for easier clicking */}
      <rect
        x={displayX - 12} y={Math.min(labelY, tickY1) - 16}
        width={24}
        height={Math.abs(labelY - tickY2) + 32}
        fill="transparent" />
    </g>
  );
}

// === Span (event with start + end): horizontal arrow + label ===
function SpanElement({ event, effective, x1, x2, y, axisY, color, isSelected, hasDeps, DAY_W, onSelect, onChange }) {
  const [drag, setDrag] = useState(null);

  const startDrag = (mode) => (e) => {
    e.stopPropagation();
    e.preventDefault();
    // When the event has deps, start and move are not allowed (start is locked)
    // but end is always allowed (changes the duration).
    if (hasDeps && (mode === 'move' || mode === 'start')) {
      onSelect();
      return;
    }
    document.body.classList.add(mode === 'move' ? 'dragging-move' : 'dragging');
    setDrag({ mode, startX: e.clientX, deltaDays: 0, moved: false });
  };

  useEffect(() => {
    if (!drag) return;
    const onMove = (e) => {
      const dx = e.clientX - drag.startX;
      const deltaDays = Math.round(dx / DAY_W);
      const moved = Math.abs(dx) > 3;
      if (deltaDays !== drag.deltaDays || moved !== drag.moved) {
        setDrag((d) => ({ ...d, deltaDays, moved }));
      }
    };
    const onUp = () => {
      if (drag.moved && drag.deltaDays !== 0) {
        const dd = drag.deltaDays;
        if (drag.mode === 'move') {
          onChange({
            start: shiftDate(event.start, dd),
            end: shiftDate(event.end, dd),
          });
        } else if (drag.mode === 'start') {
          let newStart = shiftDate(event.start, dd);
          if (parseDate(newStart) > parseDate(event.end)) newStart = event.end;
          onChange({ start: newStart });
        } else if (drag.mode === 'end') {
          let newEnd = shiftDate(event.end, dd);
          if (parseDate(newEnd) < parseDate(event.start)) newEnd = event.start;
          onChange({ end: newEnd });
        }
      } else if (!drag.moved) {
        onSelect();
      }
      document.body.classList.remove('dragging', 'dragging-move');
      setDrag(null);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
  }, [drag, event, DAY_W, onChange, onSelect]);

  let dispX1 = x1, dispX2 = x2;
  if (drag && drag.moved) {
    const dx = drag.deltaDays * DAY_W;
    if (drag.mode === 'move') { dispX1 = x1 + dx; dispX2 = x2 + dx; }
    else if (drag.mode === 'start') { dispX1 = Math.min(x1 + dx, x2 - 10); }
    else if (drag.mode === 'end') { dispX2 = Math.max(x2 + dx, x1 + 10); }
  }
  const midX = (dispX1 + dispX2) / 2;
  const startLabel = parseDate(effective.start).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  const endLabel = parseDate(effective.end).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });

  return (
    <g>
      {/* Connector dropping from span to axis at each end */}
      <line x1={dispX1} x2={dispX1} y1={y + 6} y2={axisY}
        stroke={color} strokeWidth={1} strokeDasharray="2 2" opacity={0.5} />
      <line x1={dispX2} x2={dispX2} y1={y + 6} y2={axisY}
        stroke={color} strokeWidth={1} strokeDasharray="2 2" opacity={0.5} />

      {/* Arrow shaft (draggable for move) */}
      <line
        x1={dispX1} x2={dispX2}
        y1={y} y2={y}
        stroke={color}
        strokeWidth={isSelected ? 4 : 3}
        strokeLinecap="round"
        onMouseDown={startDrag('move')}
        style={{ cursor: 'grab' }} />

      {/* Left cap */}
      <circle cx={dispX1} cy={y} r={isSelected ? 6 : 5}
        fill={color}
        stroke={isSelected ? '#1c1917' : '#fff'}
        strokeWidth={isSelected ? 2 : 1.5}
        onMouseDown={startDrag('start')}
        style={{ cursor: 'ew-resize' }} />
      {/* Right cap as arrow head */}
      <polygon
        points={(dispX2 - 8) + ',' + (y - 5) + ' ' + (dispX2) + ',' + y + ' ' + (dispX2 - 8) + ',' + (y + 5)}
        fill={color}
        stroke={isSelected ? '#1c1917' : 'none'}
        strokeWidth={isSelected ? 1.5 : 0}
        onMouseDown={startDrag('end')}
        style={{ cursor: 'ew-resize' }} />

      {/* Label centered above */}
      <text
        x={midX} y={y - 8}
        fontSize={11} fontWeight={600}
        fill="#1c1917"
        textAnchor="middle" fontFamily="DM Sans, sans-serif">
        {event.name}
      </text>

      {/* Date labels at extremities */}
      <text x={dispX1} y={y + 18}
        fontSize={9} fill="#78716c"
        textAnchor="middle" fontFamily="DM Sans, sans-serif">
        {startLabel}
      </text>
      <text x={dispX2} y={y + 18}
        fontSize={9} fill="#78716c"
        textAnchor="middle" fontFamily="DM Sans, sans-serif">
        {endLabel}
      </text>

      {event.comment && (
        <text x={midX} y={y - 22}
          fontSize={9} fill="#a8a29e"
          textAnchor="middle" fontFamily="DM Sans, sans-serif">
          💬
        </text>
      )}
    </g>
  );
}

function ChronoEventDetail({ event, allEvents, effective, effectiveEventDates, updateEvent, deleteEvent, onSelect, onClose }) {
  const [depDropdownOpen, setDepDropdownOpen] = useState(false);
  const eff = effective || { start: event.start, end: event.end };
  const hasDeps = (event.deps || []).length > 0;
  const depCandidates = (allEvents || []).filter((e) => e.id !== event.id);

  // Events depending on this one (blocked by it)
  const blockedByThis = (allEvents || []).filter((e) => (e.deps || []).includes(event.id));
  // Events this one depends on
  const blockingThis = (event.deps || [])
    .map((id) => (allEvents || []).find((e) => e.id === id))
    .filter(Boolean);

  function toggleDep(id) {
    const cur = event.deps || [];
    const next = cur.includes(id) ? cur.filter((d) => d !== id) : [...cur, id];
    updateEvent({ deps: next });
  }

  return (
    <div className="rounded-xl border p-4" style={{ background: '#fff', borderColor: '#e7e5e4' }}>
      <div className="flex items-start justify-between gap-3 mb-3">
        <div className="flex items-start gap-2 min-w-0 flex-1">
          <div className="w-1 self-stretch rounded-full flex-shrink-0 mt-1"
            style={{ background: event.color || '#0d9488', minHeight: 20 }} />
          <input value={event.name}
            onChange={(e) => updateEvent({ name: e.target.value })}
            className="font-display text-lg font-semibold leading-tight w-full px-2 py-1 rounded outline-none -ml-2"
            style={{ background: 'transparent', borderBottom: '1px dashed transparent' }}
            onFocus={(e) => (e.target.style.borderBottomColor = '#d6d3d1')}
            onBlur={(e) => (e.target.style.borderBottomColor = 'transparent')} />
        </div>
        <div className="flex gap-1">
          <button onClick={() => {
            if (confirm('Supprimer cet objectif ?')) deleteEvent();
          }} className="p-1.5 rounded-md hover:bg-stone-100" style={{ color: '#dc2626' }}>
            <Trash2 size={14} />
          </button>
          <button onClick={onClose} className="p-1.5 rounded-md hover:bg-stone-100" style={{ color: '#78716c' }}>
            <X size={15} />
          </button>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3 mb-3">
        <Field label="Début" hint={hasDeps ? 'auto (rattachement)' : undefined}>
          <div className="relative">
            <input type="date" value={hasDeps ? eff.start : event.start}
              onChange={(e) => updateEvent({ start: e.target.value })}
              disabled={hasDeps}
              className="w-full px-2 py-1.5 text-xs rounded-md border outline-none"
              style={{
                borderColor: '#d6d3d1',
                background: hasDeps ? '#f5f5f4' : '#fafaf7',
                color: hasDeps ? '#78716c' : '#1c1917',
                cursor: hasDeps ? 'not-allowed' : 'auto',
              }} />
            {hasDeps && (
              <span className="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none" style={{ color: '#a8a29e' }}>
                <Lock size={11} />
              </span>
            )}
          </div>
        </Field>
        <Field label="Fin" hint="optionnel">
          <div className="relative">
            <input type="date" value={hasDeps ? (eff.end || '') : (event.end || '')}
              onChange={(e) => updateEvent({ end: e.target.value || null })}
              className="w-full px-2 py-1.5 text-xs rounded-md border outline-none"
              style={{ borderColor: '#d6d3d1', background: '#fafaf7' }} />
            {(hasDeps ? eff.end : event.end) && (
              <button onClick={() => updateEvent({ end: null })}
                className="absolute right-1 top-1/2 -translate-y-1/2 p-1 rounded hover:bg-stone-100"
                style={{ color: '#a8a29e' }}>
                <X size={10} />
              </button>
            )}
          </div>
        </Field>
      </div>

      {hasDeps && (
        <p className="text-[10px] italic mb-3" style={{ color: '#a8a29e' }}>
          Le début est calé automatiquement sur la fin du rattachement.
        </p>
      )}

      {/* Dependency management */}
      <Field label="Rattaché à (la date de début suit)">
        <div>
          <button type="button" onClick={() => setDepDropdownOpen(!depDropdownOpen)}
            className="w-full px-2 py-1.5 text-xs rounded-md border text-left flex items-center justify-between"
            style={{ borderColor: '#d6d3d1', background: '#fafaf7' }}
            disabled={depCandidates.length === 0}>
            <span style={{ color: blockingThis.length ? '#1c1917' : '#a8a29e' }}>
              {depCandidates.length === 0
                ? 'Aucun autre objectif disponible'
                : blockingThis.length === 0
                ? 'Aucun (optionnel)'
                : blockingThis.length + ' objectif' + (blockingThis.length > 1 ? 's' : '')}
            </span>
            {depDropdownOpen ? <ChevronUp size={12} style={{ color: '#78716c' }} /> : <ChevronDown size={12} style={{ color: '#78716c' }} />}
          </button>
          {depDropdownOpen && depCandidates.length > 0 && (
            <div className="mt-1 w-full rounded-md border shadow-sm max-h-44 overflow-auto scroll-area"
              style={{ background: '#fff', borderColor: '#d6d3d1' }}>
              {depCandidates.map((e) => {
                const checked = (event.deps || []).includes(e.id);
                const eEff = effectiveEventDates?.get(e.id) || { start: e.start, end: e.end };
                return (
                  <label key={e.id}
                    className="flex items-center gap-2 px-3 py-1.5 cursor-pointer text-xs hover:bg-stone-50"
                    style={{ borderBottom: '1px solid #f5f5f4' }}>
                    <input type="checkbox" checked={checked} onChange={() => toggleDep(e.id)} />
                    <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: e.color || '#0d9488' }} />
                    <span className="truncate flex-1">{e.name}</span>
                    <span style={{ color: '#a8a29e' }}>
                      {fmt(eEff.end || eEff.start)}
                    </span>
                  </label>
                );
              })}
            </div>
          )}
          {/* Chips */}
          {blockingThis.length > 0 && !depDropdownOpen && (
            <div className="mt-2 flex flex-wrap gap-1">
              {blockingThis.map((d) => (
                <button key={d.id}
                  onClick={() => onSelect && onSelect(d.id)}
                  className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs hover:bg-stone-200"
                  style={{ background: '#f5f5f4', color: '#57534e' }}
                  title="Aller à cet objectif">
                  <span className="w-1.5 h-1.5 rounded-full" style={{ background: d.color || '#0d9488' }} />
                  {d.name}
                  <span onClick={(e) => { e.stopPropagation(); toggleDep(d.id); }}
                    className="ml-0.5 hover:text-stone-900 cursor-pointer">
                    <X size={9} />
                  </span>
                </button>
              ))}
            </div>
          )}
        </div>
      </Field>

      {blockedByThis.length > 0 && (
        <div className="mt-3 pt-3 border-t" style={{ borderColor: '#f5f5f4' }}>
          <div className="text-[10px] uppercase tracking-wider mb-1.5" style={{ color: '#a8a29e' }}>
            Bloque ({blockedByThis.length})
          </div>
          <div className="flex flex-wrap gap-1">
            {blockedByThis.map((d) => (
              <button key={d.id}
                onClick={() => onSelect && onSelect(d.id)}
                className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs hover:bg-stone-200"
                style={{ background: '#f5f5f4', color: '#57534e' }}
                title="Aller à cet objectif">
                <span className="w-1.5 h-1.5 rounded-full" style={{ background: d.color || '#0d9488' }} />
                {d.name}
              </button>
            ))}
          </div>
        </div>
      )}

      <Field label="Commentaire">
        <textarea value={event.comment || ''}
          onChange={(e) => updateEvent({ comment: e.target.value })}
          rows={3}
          placeholder="Détails, contexte, notes..."
          className="w-full px-3 py-2 text-sm rounded-md border outline-none resize-y"
          style={{ borderColor: '#d6d3d1', background: '#fafaf7' }} />
      </Field>

      <div className="mt-3 flex items-center gap-1.5 flex-wrap">
        <span className="text-[10px] uppercase tracking-wider" style={{ color: '#a8a29e' }}>Couleur</span>
        {EVENT_PALETTE.map((c) => (
          <button key={c}
            onClick={() => updateEvent({ color: c })}
            className="w-5 h-5 rounded-full transition-transform hover:scale-110"
            style={{
              background: c,
              boxShadow: event.color === c ? '0 0 0 2px #1c1917' : 'none',
            }} />
        ))}
      </div>
    </div>
  );
}

// === Import / Export view ===
function DataView({ tasks, folders, timelines, downloadExport, parseImportFile, applyImport }) {
  const [importPayload, setImportPayload] = useState(null);
  const [importFilename, setImportFilename] = useState('');
  const [importError, setImportError] = useState('');
  const [importScope, setImportScope] = useState('all');
  const [importMode, setImportMode] = useState('merge'); // 'merge' | 'replace'
  const [confirmReplace, setConfirmReplace] = useState(false);
  const [success, setSuccess] = useState('');
  const fileInputRef = useRef(null);

  function onFileChosen(e) {
    setImportError('');
    setSuccess('');
    setImportPayload(null);
    setImportFilename('');
    const file = e.target.files?.[0];
    if (!file) return;
    setImportFilename(file.name);
    const reader = new FileReader();
    reader.onload = () => {
      const parsed = parseImportFile(reader.result);
      if (!parsed || (!parsed.tasks && !parsed.folders && !parsed.timelines)) {
        setImportError('Ce fichier n\'a pas le format attendu (planning JSON).');
        return;
      }
      setImportPayload(parsed);
      // Default scope based on what's in the file
      if (parsed.tasks || parsed.folders) {
        if (parsed.timelines) setImportScope('all');
        else setImportScope('diagramme');
      } else if (parsed.timelines) {
        setImportScope('frises');
      }
    };
    reader.onerror = () => setImportError('Impossible de lire le fichier.');
    reader.readAsText(file);
    // Allow re-uploading the same file later
    e.target.value = '';
  }

  function runImport() {
    if (!importPayload) return;
    if (importMode === 'replace' && !confirmReplace) {
      setImportError('Coche la case de confirmation pour remplacer tes données actuelles.');
      return;
    }
    applyImport(importPayload, importScope, importMode);
    setSuccess(
      importMode === 'replace'
        ? 'Données importées en remplacement.'
        : 'Données importées et ajoutées à l\'existant.'
    );
    setImportPayload(null);
    setImportFilename('');
    setConfirmReplace(false);
  }

  function clearImport() {
    setImportPayload(null);
    setImportFilename('');
    setImportError('');
    setConfirmReplace(false);
  }

  // Build a compact summary of what the import contains
  const importSummary = importPayload ? {
    tasks: importPayload.tasks?.length || 0,
    folders: importPayload.folders?.length || 0,
    timelines: importPayload.timelines?.length || 0,
    events: (importPayload.timelines || []).reduce((acc, t) => acc + (t.events?.length || 0), 0),
  } : null;

  const hasDiagramme = importPayload && (importPayload.tasks || importPayload.folders);
  const hasFrises = importPayload && importPayload.timelines;

  return (
    <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4">
      {/* Export */}
      <section className="rounded-xl border p-5 space-y-4" style={{ background: '#fff', borderColor: '#e7e5e4' }}>
        <div className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-md flex items-center justify-center" style={{ background: '#1c1917', color: '#fafaf7' }}>
            <Download size={15} />
          </div>
          <div>
            <h2 className="font-display text-lg font-semibold leading-tight">Exporter</h2>
            <p className="text-[11px]" style={{ color: '#78716c' }}>Télécharge un fichier JSON de tes données.</p>
          </div>
        </div>

        <div className="space-y-2 text-xs" style={{ color: '#57534e' }}>
          <div className="flex items-center justify-between px-3 py-2 rounded-md" style={{ background: '#fafaf7' }}>
            <span>Tâches</span>
            <span className="font-mono text-[11px]">{tasks.length}</span>
          </div>
          <div className="flex items-center justify-between px-3 py-2 rounded-md" style={{ background: '#fafaf7' }}>
            <span>Dossiers</span>
            <span className="font-mono text-[11px]">{folders.length}</span>
          </div>
          <div className="flex items-center justify-between px-3 py-2 rounded-md" style={{ background: '#fafaf7' }}>
            <span>Frises chronologiques</span>
            <span className="font-mono text-[11px]">{timelines.length}</span>
          </div>
          <div className="flex items-center justify-between px-3 py-2 rounded-md" style={{ background: '#fafaf7' }}>
            <span>Objectifs (total)</span>
            <span className="font-mono text-[11px]">{timelines.reduce((a, t) => a + (t.events?.length || 0), 0)}</span>
          </div>
        </div>

        <div className="space-y-2">
          <button onClick={() => downloadExport('all')}
            disabled={tasks.length === 0 && folders.length === 0 && timelines.length === 0}
            className="w-full py-2.5 rounded-md text-sm font-semibold flex items-center justify-center gap-2"
            style={{
              background: '#1c1917', color: '#fafaf7',
              opacity: (tasks.length === 0 && folders.length === 0 && timelines.length === 0) ? 0.5 : 1,
            }}>
            <Download size={14} />Tout exporter
          </button>
          <div className="grid grid-cols-2 gap-2">
            <button onClick={() => downloadExport('diagramme')}
              disabled={tasks.length === 0 && folders.length === 0}
              className="py-2 rounded-md text-xs font-medium flex items-center justify-center gap-1.5"
              style={{
                background: '#f5f5f4', color: '#1c1917',
                opacity: (tasks.length === 0 && folders.length === 0) ? 0.5 : 1,
              }}>
              <BarChart3 size={12} />Diagramme seul
            </button>
            <button onClick={() => downloadExport('frises')}
              disabled={timelines.length === 0}
              className="py-2 rounded-md text-xs font-medium flex items-center justify-center gap-1.5"
              style={{
                background: '#f5f5f4', color: '#1c1917',
                opacity: timelines.length === 0 ? 0.5 : 1,
              }}>
              <Calendar size={12} />Frises seules
            </button>
          </div>
        </div>
      </section>

      {/* Import */}
      <section className="rounded-xl border p-5 space-y-4" style={{ background: '#fff', borderColor: '#e7e5e4' }}>
        <div className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-md flex items-center justify-center" style={{ background: '#1c1917', color: '#fafaf7' }}>
            <Upload size={15} />
          </div>
          <div>
            <h2 className="font-display text-lg font-semibold leading-tight">Importer</h2>
            <p className="text-[11px]" style={{ color: '#78716c' }}>Charge un fichier JSON exporté précédemment.</p>
          </div>
        </div>

        {!importPayload && (
          <>
            <input ref={fileInputRef} type="file" accept=".json,application/json"
              onChange={onFileChosen} style={{ display: 'none' }} />
            <button onClick={() => fileInputRef.current?.click()}
              className="w-full py-8 rounded-lg border-2 border-dashed flex flex-col items-center gap-2 transition-colors hover:bg-stone-50"
              style={{ borderColor: '#d6d3d1', color: '#57534e' }}>
              <Upload size={20} style={{ color: '#a8a29e' }} />
              <span className="text-sm font-medium">Choisir un fichier .json</span>
              <span className="text-[10px]" style={{ color: '#a8a29e' }}>ou glisse-le ici</span>
            </button>
            {importError && (
              <div className="flex items-start gap-2 text-xs px-3 py-2 rounded-md"
                style={{ background: '#fef2f2', color: '#b91c1c' }}>
                <AlertCircle size={14} className="mt-0.5 flex-shrink-0" />
                <span>{importError}</span>
              </div>
            )}
            {success && (
              <div className="flex items-start gap-2 text-xs px-3 py-2 rounded-md"
                style={{ background: '#dcfce7', color: '#166534' }}>
                <Check size={14} className="mt-0.5 flex-shrink-0" />
                <span>{success}</span>
              </div>
            )}
          </>
        )}

        {importPayload && (
          <div className="space-y-3">
            {/* File summary */}
            <div className="rounded-md border p-3" style={{ background: '#fafaf7', borderColor: '#e7e5e4' }}>
              <div className="flex items-center gap-2 mb-2">
                <FileText size={13} style={{ color: '#78716c' }} />
                <span className="text-xs font-medium truncate flex-1">{importFilename}</span>
                <button onClick={clearImport} className="p-0.5 rounded hover:bg-stone-200" style={{ color: '#a8a29e' }}>
                  <X size={12} />
                </button>
              </div>
              <div className="grid grid-cols-2 gap-1 text-[11px]" style={{ color: '#57534e' }}>
                {hasDiagramme && <><span>{importSummary.tasks} tâches</span><span>{importSummary.folders} dossiers</span></>}
                {hasFrises && <><span>{importSummary.timelines} frises</span><span>{importSummary.events} objectifs</span></>}
              </div>
            </div>

            {/* Scope selector (only if file has both) */}
            {hasDiagramme && hasFrises && (
              <div>
                <span className="text-[10px] uppercase tracking-wider mb-1 block" style={{ color: '#57534e' }}>Quoi importer</span>
                <div className="grid grid-cols-3 gap-1 p-1 rounded-md" style={{ background: '#f5f5f4' }}>
                  {[
                    { id: 'all', label: 'Tout' },
                    { id: 'diagramme', label: 'Diagramme' },
                    { id: 'frises', label: 'Frises' },
                  ].map((s) => (
                    <button key={s.id} onClick={() => setImportScope(s.id)}
                      className="px-2 py-1 rounded text-xs font-medium"
                      style={{
                        background: importScope === s.id ? '#fafaf7' : 'transparent',
                        color: importScope === s.id ? '#1c1917' : '#57534e',
                        boxShadow: importScope === s.id ? '0 1px 2px rgba(0,0,0,0.06)' : 'none',
                      }}>
                      {s.label}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* Mode selector */}
            <div>
              <span className="text-[10px] uppercase tracking-wider mb-1 block" style={{ color: '#57534e' }}>Comment</span>
              <div className="space-y-1">
                <label className="flex items-start gap-2 px-3 py-2 rounded-md cursor-pointer"
                  style={{ background: importMode === 'merge' ? '#f5f5f4' : 'transparent', border: '1px solid ' + (importMode === 'merge' ? '#1c1917' : '#e7e5e4') }}>
                  <input type="radio" checked={importMode === 'merge'} onChange={() => { setImportMode('merge'); setConfirmReplace(false); }} className="mt-0.5" />
                  <div className="flex-1">
                    <div className="text-xs font-medium">Ajouter aux données existantes</div>
                    <div className="text-[10px]" style={{ color: '#78716c' }}>Tes données actuelles sont conservées, les nouvelles sont ajoutées avec des identifiants frais.</div>
                  </div>
                </label>
                <label className="flex items-start gap-2 px-3 py-2 rounded-md cursor-pointer"
                  style={{ background: importMode === 'replace' ? '#fef2f2' : 'transparent', border: '1px solid ' + (importMode === 'replace' ? '#dc2626' : '#e7e5e4') }}>
                  <input type="radio" checked={importMode === 'replace'} onChange={() => setImportMode('replace')} className="mt-0.5" />
                  <div className="flex-1">
                    <div className="text-xs font-medium" style={{ color: importMode === 'replace' ? '#b91c1c' : '#1c1917' }}>Remplacer les données existantes</div>
                    <div className="text-[10px]" style={{ color: '#78716c' }}>
                      {importScope === 'all'
                        ? 'Toutes tes tâches, dossiers et frises actuels seront supprimés.'
                        : importScope === 'diagramme'
                        ? 'Tes tâches et dossiers actuels seront supprimés (les frises restent).'
                        : 'Tes frises actuelles seront supprimées (le diagramme reste).'}
                    </div>
                  </div>
                </label>
              </div>
            </div>

            {importMode === 'replace' && (
              <label className="flex items-start gap-2 px-3 py-2 rounded-md text-[11px]"
                style={{ background: '#fef2f2', color: '#b91c1c' }}>
                <input type="checkbox" checked={confirmReplace}
                  onChange={(e) => setConfirmReplace(e.target.checked)} className="mt-0.5" />
                <span>Je comprends que mes données actuelles seront définitivement supprimées.</span>
              </label>
            )}

            {importError && (
              <div className="flex items-start gap-2 text-xs px-3 py-2 rounded-md"
                style={{ background: '#fef2f2', color: '#b91c1c' }}>
                <AlertCircle size={14} className="mt-0.5 flex-shrink-0" />
                <span>{importError}</span>
              </div>
            )}

            <div className="flex gap-2">
              <button onClick={clearImport}
                className="px-3 py-2 rounded-md text-sm font-medium"
                style={{ background: '#f5f5f4', color: '#57534e' }}>
                Annuler
              </button>
              <button onClick={runImport}
                disabled={importMode === 'replace' && !confirmReplace}
                className="flex-1 py-2 rounded-md text-sm font-semibold flex items-center justify-center gap-2"
                style={{
                  background: importMode === 'replace' ? '#dc2626' : '#1c1917',
                  color: '#fafaf7',
                  opacity: (importMode === 'replace' && !confirmReplace) ? 0.5 : 1,
                }}>
                {importMode === 'replace' ? <><AlertCircle size={13} />Remplacer</> : <><Plus size={13} />Ajouter</>}
              </button>
            </div>
          </div>
        )}
      </section>

      {/* Info banner */}
      <div className="md:col-span-2 rounded-lg p-3 text-[11px] leading-relaxed"
        style={{ background: '#eff6ff', color: '#1e40af', border: '1px solid #bfdbfe' }}>
        <p className="font-semibold mb-1">💡 Bon à savoir</p>
        <p>
          Tes données sont actuellement stockées dans ce navigateur. Le fichier d'export est ton moyen de
          sauvegarde — pense à le télécharger régulièrement (et idéalement à le mettre dans un cloud).
          Tu peux aussi t'en servir pour <strong>partager une frise ou un planning</strong> avec quelqu'un,
          ou pour <strong>passer d'un ordinateur à un autre</strong>.
        </p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
